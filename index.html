<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC Binnenmaas 1 — Trainers app</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.4.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Instelbare merk-accent (per club overschrijfbaar) */
  --accent:#2B7A30;
  --accent-hover:#236227;
  --accent-light:#E9F6EA;
  --accent-grad:linear-gradient(135deg,#2B7A30,#37993d);
  /* Neutrale basis */
  --bg:#FbFbFc;
  --surface:#ffffff;
  --surface-2:#F7F8FA;
  --white:#ffffff;
  --border:#EAECEF;
  --border-soft:#F1F2F4;
  --text:#0F1729;
  --text-muted:#5B6472;
  --text-light:#9AA1AD;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(16,24,40,0.04);
  --shadow-card:0 1px 3px rgba(16,24,40,0.04),0 1px 2px rgba(16,24,40,0.03);
  --shadow-card-hover:0 4px 12px rgba(16,24,40,0.08),0 2px 4px rgba(16,24,40,0.04);
  --shadow-accent:0 2px 8px rgba(43,122,48,0.28);
  /* Legacy aliassen -> nu neutraal/accent (zodat oude klassen meebewegen) */
  --fcb-groen:var(--accent);
  --fcb-groen-licht:var(--accent-light);
  --fcb-groen-grad:var(--accent-grad);
  --fcb-geel:#F59E0B;
  --fcb-geel-licht:#FEF3E2;
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;letter-spacing:-0.006em}

/* ===== APP SHELL / SIDEBAR LAYOUT ===== */
.app-shell{display:flex;min-height:100vh}
.sidebar{width:230px;background:#0F1729;flex-shrink:0;display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sb-brand{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,0.08);margin-bottom:14px}
.sb-brand-txt{min-width:0;flex:1}
.sb-club{font-size:14px;font-weight:600;color:#fff;line-height:1.25;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-season{font-size:11px;color:#8b93a7;margin-top:2px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:99px}
.sb-season:hover{background:rgba(255,255,255,0.12);color:#c4cad8}
.sb-nav{display:flex;flex-direction:column;gap:3px;flex:1}
.sb-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;background:transparent;border:none;color:#9aa1ad;font-size:13.5px;font-weight:500;font-family:inherit;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s}
.sb-item i{font-size:18px;flex-shrink:0}
.sb-item:hover{background:rgba(255,255,255,0.06);color:#e6e8ec}
.sb-item.active{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(43,122,48,0.35)}
.sb-footer{display:flex;flex-direction:column;gap:3px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.08);margin-top:8px}
.sb-footer .hbtn{background:transparent;border:none;color:#8b93a7;justify-content:flex-start;padding:9px 11px;border-radius:9px;font-size:12.5px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:8px}
.sb-footer .hbtn:hover{background:rgba(255,255,255,0.06);color:#e6e8ec}

.main-area{flex:1;min-width:0;padding:1.5rem 2rem;width:100%}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem}
@media (max-width:900px){.stat-grid-3{grid-template-columns:1fr}}

/* App-naam bovenin sidebar */
.sb-appname{display:flex;align-items:center;gap:9px;padding:4px 8px 14px;color:#fff;font-size:15px;font-weight:700;letter-spacing:-0.01em}
.sb-appname i{color:var(--accent)}

/* Bovenbalk */
.topbar{display:flex;align-items:center;justify-content:space-between;background:#0F1729;border-radius:14px;padding:10px 16px;margin-bottom:1.25rem}
.tb-appname{display:none;align-items:center;gap:8px;color:#fff;font-size:15px;font-weight:700;letter-spacing:-0.01em}
.tb-appname i{color:var(--accent)}
.tb-user{display:flex;align-items:center;gap:11px;background:transparent;border:none;cursor:pointer;font-family:inherit;padding:4px;border-radius:10px;transition:background .15s;margin-left:auto}
.tb-user:hover{background:rgba(255,255,255,0.08)}
.tb-user-txt{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25}
.tb-user-name{font-size:13px;font-weight:600;color:#fff}
.tb-user-role{font-size:11px;color:#8b93a7}
.tb-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-grad);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0;overflow:hidden}
.tb-avatar img{width:100%;height:100%;object-fit:cover}

/* Logo in sidebar */
.logo-wrap{position:relative;width:40px;height:40px;flex-shrink:0;cursor:pointer}
.logo-ph{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-grad)}
.logo-img{width:40px;height:40px;border-radius:10px;object-fit:cover;display:none;border:1px solid rgba(255,255,255,0.15)}
.logo-ov{position:absolute;inset:0;border-radius:10px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.logo-wrap:hover .logo-ov{opacity:1}

/* Mobiele tab-bar (verborgen op desktop) */
.tabbar{display:none}

/* ===== TABLET: sidebar ingeklapt tot iconen ===== */
@media (max-width:1024px){
  .sidebar{width:60px;padding:16px 8px}
  .sb-appname span{display:none}
  .sb-appname{justify-content:center;padding:4px 0 14px}
  .sb-brand{justify-content:center;padding:6px 0 16px}
  .sb-brand-txt{display:none}
  .sb-item span{display:none}
  .sb-item{justify-content:center;padding:11px 0}
  .sb-item i{font-size:20px}
  .sb-season{display:none}
  .sb-footer .hbtn span{display:none}
  .sb-footer .hbtn{justify-content:center}
  .main-area{padding:1.5rem 1.5rem}
}

/* ===== MOBIEL: sidebar weg, tab-bar onderaan ===== */
@media (max-width:640px){
  .app-shell{flex-direction:column}
  .sidebar{display:none}
  .main-area{padding:1rem 1rem 5rem;max-width:100%}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;z-index:100;box-shadow:0 -2px 12px rgba(16,24,40,0.06)}
  .tb-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text-light);font-family:inherit;cursor:pointer;padding:4px 8px;flex:1}
  .tb-item i{font-size:21px}
  .tb-item span{font-size:10px;font-weight:500}
  .tb-item.active{color:var(--accent)}
  /* Topbalk op mobiel: toon app-naam links */
  .topbar{border-radius:0;margin:-1rem -1rem 1rem;padding:12px 16px}
  .tb-appname{display:flex}
  .tb-user-txt{display:none}
  /* Onderbalk (tab-bar) donker op mobiel */
  .tabbar{background:#0F1729 !important;border-top:1px solid rgba(255,255,255,0.08) !important}
  .tb-item{color:#8b93a7 !important}
  .tb-item.active{color:#fff !important}
  /* Veld + zijpaneel / opstelling: stapelen op mobiel */
  .veld-nieuw-grid,.veld-editor-grid,.opstelling-veld-grid{grid-template-columns:1fr !important}
  .opstelling-grid{grid-template-columns:1fr !important;justify-items:center}
}
.container{width:100%;margin:0 auto;padding:2rem 2.5rem}
@media (max-width:640px){.container{padding:1rem 1rem}}

/* Header */
.header{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:1.5rem;box-shadow:var(--shadow-card);border:1px solid var(--border)}
.header-top{display:flex;align-items:center;gap:14px;padding:16px 20px}
.logo-wrap{position:relative;width:48px;height:48px;flex-shrink:0;cursor:pointer}
.logo-ph{width:48px;height:48px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--accent-grad);color:#fff}
.logo-img{width:48px;height:48px;border-radius:12px;object-fit:cover;display:none;border:1px solid var(--border)}
.logo-ov{position:absolute;inset:0;border-radius:12px;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.logo-wrap:hover .logo-ov{opacity:1}
.header-title{font-size:18px;font-weight:600;color:var(--text);letter-spacing:-0.02em}
.header-sub{font-size:12px;color:var(--text-light);margin-top:3px;display:flex;align-items:center;gap:6px}
.season-badge{background:var(--accent-light);border:1px solid transparent;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:500;color:var(--accent);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.season-badge:hover{background:#E4E7FB}
.hdr-actions{display:flex;gap:6px;margin-left:auto}
.hbtn{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:6px 12px;font-size:12px;font-weight:500;color:var(--text-muted);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.hbtn:hover{background:#EEF0F2;color:var(--text)}
.accent-bar{height:0}
.nav{display:flex;gap:2px;padding:8px 14px;background:var(--surface);border-top:1px solid var(--border-soft);flex-wrap:wrap}
.nb{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:var(--text-muted);background:transparent;border:none;font-family:inherit;display:flex;align-items:center;gap:6px;transition:all .15s}
.nb:hover{background:#f0f3f6;color:var(--text)}
.nb.active{background:var(--fcb-groen);color:white;font-weight:600;box-shadow:var(--shadow-green)}

/* Cards */
.card{background:var(--white);border-radius:14px;padding:1.5rem 1.6rem;margin-bottom:1.25rem;box-shadow:var(--shadow-card);transition:box-shadow .2s}
.card.flush{background:transparent;box-shadow:none;padding:0;border:none}
.card.flush > .card-hdr{padding:0 4px 1rem;border-bottom:1px solid var(--border)}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:12px}
.page-title{font-size:20px;font-weight:700;letter-spacing:-0.02em;color:var(--text);display:flex;align-items:center;gap:9px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid var(--border-soft)}
.card-title{font-size:15px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:-0.01em}
.gdot{width:8px;height:8px;border-radius:50%;background:var(--fcb-groen);flex-shrink:0}
.sec-lbl{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.07em;margin-bottom:9px}
.btn-green{background:var(--fcb-groen-grad);color:white;border:none;border-radius:9px;padding:9px 17px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-green);transition:box-shadow .15s,transform .15s}
.btn-green:hover{box-shadow:0 4px 12px rgba(43,122,48,0.4);transform:translateY(-1px)}
.btn-outline{background:var(--white);border:1px solid var(--border);border-radius:9px;padding:9px 17px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;color:var(--text);box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s}
.btn-outline:hover{background:#f6f8fa;border-color:#d1d9e0}
.btn-danger{background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:7px 14px;font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;color:#dc2626}
.btn-danger:hover{background:#fef2f2}
.back-btn{background:none;border:none;cursor:pointer;color:var(--fcb-groen);font-size:13px;font-family:inherit;display:flex;align-items:center;gap:4px;padding:0;margin-bottom:1rem}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
@media(max-width:500px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-box{background:var(--white);border-radius:12px;padding:16px 14px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow-card)}
.stat-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--fcb-groen);opacity:0}
.stat-box.accent::before{background:var(--fcb-geel);opacity:1}
.stat-val{font-size:27px;font-weight:700;letter-spacing:-0.02em}
.stat-lbl{font-size:12px;color:var(--text-light);font-weight:500;margin-top:5px}

/* Badges */
.pos-pill{font-size:10px;padding:2px 7px;border-radius:99px;background:var(--fcb-groen-licht);color:#1B5E20;display:inline-block}
.bles-pill{font-size:10px;padding:2px 7px;border-radius:99px;background:#fef2f2;color:#dc2626;display:inline-block}
.nr-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--fcb-groen);color:white;font-size:10px;font-weight:600;flex-shrink:0}
.status-ok{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--fcb-groen-licht);color:#1B5E20}
.status-bles{font-size:11px;padding:2px 8px;border-radius:99px;background:#fef2f2;color:#dc2626}
.type-badge{font-size:10px;padding:2px 7px;border-radius:99px;background:#f3f4f6;color:var(--text-muted);border:1px solid var(--border)}
.badge-thuis{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--fcb-groen-licht);color:#1B5E20}
.badge-uit{font-size:10px;padding:2px 6px;border-radius:99px;background:var(--fcb-geel-licht);color:#78610a}

/* Match rows */
.match-row{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px 15px;background:var(--bg);border-radius:10px;margin-bottom:7px;border:1px solid transparent;cursor:pointer;transition:all .15s}
.match-row:hover{background:#fff;box-shadow:var(--shadow-sm);border-color:var(--border)}
.score{font-size:14px;font-weight:600;padding:2px 10px;border-radius:var(--radius)}
.score.win{background:var(--fcb-groen-licht);color:#1B5E20}
.score.draw{background:var(--fcb-geel-licht);color:#78610a}
.score.loss{background:#fef2f2;color:#dc2626}

/* View toggle */
.view-toggle{display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.vt-btn{padding:5px 10px;border:none;background:transparent;cursor:pointer;color:var(--text-muted);font-family:inherit;display:flex;align-items:center}
.vt-btn:not(:last-child){border-right:1px solid var(--border)}
.vt-btn.active{background:var(--fcb-groen);color:white}
.vt-btn:hover:not(.active){background:#f3f4f6}

/* Tegel weergave spelers */
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile-card{background:var(--white);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 20px;box-shadow:var(--shadow-card);border:1px solid var(--border-soft);transition:box-shadow .2s,transform .15s}
.tile-card:hover{box-shadow:var(--shadow-card-hover);transform:translateY(-2px)}
.tile-photo{width:56px;height:56px;border-radius:12px;object-fit:cover;flex-shrink:0}
.tile-ph{width:56px;height:56px;border-radius:12px;background:var(--fcb-groen-licht);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;font-weight:700;color:var(--fcb-groen)}

/* Lijst weergave */
.list-table{width:100%;border-collapse:collapse}
.list-table th{font-size:11px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.06em;padding:6px 10px;border-bottom:1px solid var(--border);text-align:left}
.list-table td{padding:9px 10px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
.list-table tr:last-child td{border-bottom:none}
.list-table tr{cursor:pointer}
.list-table tr:hover td{background:var(--bg)}
.list-av{width:32px;height:32px;border-radius:6px;object-fit:cover}
.list-av-ph{width:32px;height:32px;border-radius:6px;background:var(--fcb-groen-licht);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--fcb-groen)}

/* Speler detail */
.detail-layout{display:grid;grid-template-columns:140px 1fr;gap:1.25rem;align-items:start}
@media(max-width:500px){.detail-layout{grid-template-columns:1fr}}
.det-photo{width:140px;height:140px;border-radius:14px;object-fit:cover;box-shadow:var(--shadow-card)}
.det-ph{width:140px;height:140px;border-radius:14px;background:var(--fcb-groen-licht);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-card)}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.info-box{background:var(--bg);border-radius:10px;padding:12px 14px}
.info-lbl{font-size:11px;color:var(--text-muted);margin-bottom:3px}
.info-val{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-0.01em}

/* Formaties */
.form-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.form-opt{padding:7px;border:1px solid var(--border);border-radius:var(--radius);text-align:center;cursor:pointer;font-size:12px;color:var(--text-muted);background:var(--white)}
.form-opt.selected{background:var(--fcb-groen-licht);border-color:var(--fcb-groen);color:#1B5E20;font-weight:600}

/* Veld */
.field-outer{background:#2a5c17;border-radius:var(--radius-lg);padding:10px;width:100%;max-width:280px;margin:0 auto}

/* Seizoenen */
.season-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-radius:10px;margin-bottom:7px;border:1px solid transparent}
.season-row.active-season{border-color:var(--fcb-groen);background:var(--fcb-groen-licht)}
.s-actief{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--fcb-groen-licht);color:#1B5E20}
.s-archief{font-size:11px;padding:2px 8px;border-radius:99px;background:#f3f4f6;color:var(--text-muted);border:1px solid var(--border)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:3px 5px;border-radius:var(--radius);font-size:15px}
.icon-btn:hover{background:#f3f4f6;color:var(--text)}
.icon-btn.danger:hover{color:#dc2626}

/* Tab bar */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.25rem}
.tab{padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--fcb-groen);border-bottom-color:var(--fcb-groen);font-weight:600}
.tab{transition:color .15s}
.tab:hover:not(.active){color:var(--text)}

/* Rol badges */
.badge-staf{background:#e0f2fe;color:#0369a1;font-size:11px;padding:2px 8px;border-radius:99px}
.badge-speler{background:var(--fcb-groen-licht);color:#1B5E20;font-size:11px;padding:2px 8px;border-radius:99px}
.badge-fan{background:var(--fcb-geel-licht);color:#78610a;font-size:11px;padding:2px 8px;border-radius:99px}

/* Live */
.live-badge{background:#dc2626;color:white;font-size:10px;padding:2px 8px;border-radius:99px;display:inline-flex;align-items:center;gap:3px}
.clock-display{font-size:28px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--text)}
.clock-extra{color:#dc2626}

/* Form inputs */
.field-input{border:1px solid var(--border);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;background:var(--white);color:var(--text);width:100%;transition:border-color .15s,box-shadow .15s}
.field-input:focus{outline:none;border-color:var(--fcb-groen);box-shadow:0 0 0 3px rgba(43,122,48,.12)}
.field-label{font-size:12px;color:var(--text-muted);margin-bottom:4px;display:block}
.field-box{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:500px){.form-grid{grid-template-columns:1fr}}

/* Toast */
.toast{background:var(--fcb-groen-licht);border:1px solid #b8e0bb;border-radius:10px;padding:11px 15px;font-size:13px;font-weight:500;color:#1B5E20;display:flex;align-items:center;gap:8px;margin-bottom:1rem;box-shadow:var(--shadow-sm)}

/* Divider */
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0}

/* Rollen */
.user-row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:start;padding:13px 15px;background:var(--bg);border-radius:10px;margin-bottom:8px}
.user-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}

/* Skills */
.skill-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.skill-bar-bg{flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden}
.skill-bar{height:100%;border-radius:3px;background:var(--fcb-groen)}

/* Blessure */
.bles-row{display:flex;align-items:start;justify-content:space-between;padding:11px 14px;background:var(--bg);border-radius:10px;margin-bottom:6px;border:1px solid var(--border-soft)}
.bles-actief{border-color:#dc2626}

/* Wedstrijd events */
.event-row{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--bg);border-radius:10px;font-size:13px;margin-bottom:6px}
.event-min{font-size:12px;font-weight:600;color:var(--text-muted);width:42px;flex-shrink:0;font-variant-numeric:tabular-nums}
</style>
</head>

// Klok
function klokSeconds(){
  if(!klokStart||klokPhase==='voor'||klokPhase==='rust'||klokPhase==='afgelopen') return klokElapsed;
  return klokElapsed+Math.floor((Date.now()-klokStart)/1000);
}
function klokLabel(){
  const s=klokSeconds(),mm=Math.floor(s/60),ss=s%60;
  if(klokPhase==='rust') return{display:'HT',extra:false};
  if(klokPhase==='afgelopen') return{display:'FT',extra:false};
  if(klokPhase==='voor') return{display:'00:00',extra:false};
  if(mm>=90) return{display:`90+${pad(mm-90)}:${pad(ss)}`,extra:true};
  return{display:`${pad(mm)}:${pad(ss)}`,extra:false};
}
function klokNu(){const s=klokSeconds(),mm=Math.floor(s/60),ss=s%60;if(mm>=90)return`90+${pad(mm-90)}:${pad(ss)}`;return`${pad(mm)}:${pad(ss)}`;}

const WEDSTRIJD_MINUTEN = 90;

// Status op basis van datum + expliciete 'gespeeld' status (na affluiten live)
function wedstrijdStatus(w){
  if(w.status==='gespeeld') return 'gespeeld';
  if(w.status==='live') return 'live';
  const vandaag = new Date().toISOString().split('T')[0];
  return w.datum < vandaag ? 'gespeeld' : 'gepland';
}
function isGespeeld(w){ return wedstrijdStatus(w)==='gespeeld'; }
function isGepland(w){ return wedstrijdStatus(w)==='gepland'; }

// Lazy-init van de nieuwe wedstrijd-velden
function ensureWedstrijdVelden(w){
  if(!w.selectie) w.selectie = {};
  if(!w.opstellingPos) w.opstellingPos = {}; // posIndex -> spelerId
  if(!w.wisselBank) w.wisselBank = [];        // spelerIds op de bank
  if(!w.wissels) w.wissels = [];              // {min, uit, in}
  if(!w.speelminuten) w.speelminuten = {};    // spelerId -> minuten
  return w;
}
function getSelectieStatus(w, spelerId){ return w.selectie[spelerId] || 'aanwezig'; }
function setSelectieStatus(w, spelerId, status){
  ensureWedstrijdVelden(w);
  if(status==='aanwezig') delete w.selectie[spelerId];
  else w.selectie[spelerId] = status;
  draw();
}
// Spelers die beschikbaar zijn voor de opstelling (aanwezig in de selectie)
function beschikbareSelectie(w){
  return spelers.filter(s=>s.type==='team' && getSelectieStatus(w,s.id)==='aanwezig');
}

// Speelminuten automatisch berekenen op basis van opstelling + wissels
function berekenSpeelminuten(w){
  ensureWedstrijdVelden(w);
  const mins = {};
  // Basiself: iedereen die start speelt vanaf 0
  const basis = Object.values(w.opstellingPos).filter(Boolean);
  basis.forEach(id=>{ mins[id] = WEDSTRIJD_MINUTEN; });
  // Wissels: speler-uit speelt tot wisselminuut, speler-in vanaf wisselminuut
  (w.wissels||[]).forEach(ws=>{
    const m = parseInt(ws.min)||0;
    if(ws.uit) mins[ws.uit] = m;
    if(ws.in) mins[ws.in] = WEDSTRIJD_MINUTEN - m;
  });
  return mins;
}
// Synchroniseer berekende speelminuten naar w.speelminuten (behoudt handmatige overrides niet)
function syncSpeelminuten(w){
  w.speelminuten = berekenSpeelminuten(w);
}

function genereerVastePionLijnen(items, verbindingen){
  if(!verbindingen || verbindingen.length===0) return '';
  const pionMap = {};
  (items||[]).forEach(i=>{ if(i.type==='pion'&&i.pionId!==undefined) pionMap[i.pionId]=i; });
  let svg = '';
  verbindingen.forEach(v=>{
    const p1 = pionMap[v.van], p2 = pionMap[v.naar];
    if(!p1||!p2) return;
    const dx = p2.x-p1.x, dy = p2.y-p1.y;
    const meters = Math.round(Math.sqrt(dx*dx+dy*dy) * METER_PER_PX);
    const midX = (p1.x+p2.x)/2, midY = (p1.y+p2.y)/2;
    const labelText = meters+'m';
    const tw = labelText.length*4+4;
    svg += `<g style="pointer-events:none">
      <line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="white" stroke-width="0.8" opacity="0.7"/>
      <rect x="${midX-tw/2}" y="${midY-6}" width="${tw}" height="10" rx="2" fill="rgba(0,0,0,0.55)"/>
      <text x="${midX}" y="${midY+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="7" font-family="system-ui" font-weight="600">${labelText}</text>
    </g>`;
  });
  return svg;
}

function getLaatstePion(){
  // Gebruik expliciet de laatst geplaatste/geklikte pion (via laatsteGeplaatstePionId)
  // Zo stopt de meetlijn direct bij deselecteren (dan is laatsteGeplaatstePionId null)
  if(laatsteGeplaatstePionId===null) return null;
  let items;
  if(toonNieuweOefening!==null && nieuwOefening){
    items = nieuwOefening.items||[];
  } else if(activeOefeningId!==null){
    const oef = (oefeningen[activeTrainingId]||[]).find(o=>o.id===activeOefeningId);
    items = oef?oef.items||[]:[];
  } else return null;
  return items.find(i=>i.type==='pion' && i.pionId===laatsteGeplaatstePionId) || null;
}

function handleVeldMuisBeweging(event){
  // Alleen tonen als we in pion-plaats modus zijn
  const inPionModus = geselecteerdPlaatsItem && geselecteerdPlaatsItem.type==='pion';
  if(!inPionModus){ muisVeldPos=null; tekenAfstandLijn(); return; }
  const svg = event.currentTarget;
  const pt = getSVGPoint(event, svg);
  if(!isFinite(pt.x)||!isFinite(pt.y)){ return; }
  muisVeldPos = {x:pt.x, y:pt.y};
  tekenAfstandLijn();
}

function tekenAfstandLijn(){
  // Verwijder bestaande afstandslijn
  document.querySelectorAll('.afstand-overlay').forEach(el=>el.remove());
  if(!muisVeldPos) return;
  const laatstePion = getLaatstePion();
  if(!laatstePion) return;
  const svg = document.querySelector('svg[data-veld]');
  if(!svg) return;
  // Bereken afstand in meters
  const dx = muisVeldPos.x - laatstePion.x;
  const dy = muisVeldPos.y - laatstePion.y;
  const pxAfstand = Math.sqrt(dx*dx + dy*dy);
  const meters = Math.round(pxAfstand * METER_PER_PX);
  // Teken lijn via createElementNS (SVG namespace correct)
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','afstand-overlay');
  g.style.pointerEvents = 'none';
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', laatstePion.x);
  line.setAttribute('y1', laatstePion.y);
  line.setAttribute('x2', muisVeldPos.x);
  line.setAttribute('y2', muisVeldPos.y);
  line.setAttribute('stroke', 'white');
  line.setAttribute('stroke-width', '0.8');
  line.setAttribute('stroke-dasharray', '3 2');
  line.setAttribute('opacity', '0.9');
  g.appendChild(line);
  // Label met meters op midden van de lijn
  const midX = (laatstePion.x + muisVeldPos.x)/2;
  const midY = (laatstePion.y + muisVeldPos.y)/2;
  const labelBg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  const labelText = meters + 'm';
  const tw = labelText.length * 4 + 4;
  labelBg.setAttribute('x', midX - tw/2);
  labelBg.setAttribute('y', midY - 6);
  labelBg.setAttribute('width', tw);
  labelBg.setAttribute('height', 10);
  labelBg.setAttribute('rx', 2);
  labelBg.setAttribute('fill', 'rgba(0,0,0,0.6)');
  g.appendChild(labelBg);
  const text = document.createElementNS('http://www.w3.org/2000/svg','text');
  text.setAttribute('x', midX);
  text.setAttribute('y', midY + 1);
  text.setAttribute('text-anchor', 'middle');
  text.setAttribute('dominant-baseline', 'middle');
  text.setAttribute('fill', 'white');
  text.setAttribute('font-size', '7');
  text.setAttribute('font-family', 'system-ui');
  text.setAttribute('font-weight', '600');
  text.textContent = labelText;
  g.appendChild(text);
  svg.appendChild(g);
}

        </div>

    .sort((a,b)=>(b.doelpunten||0)-(a.doelpunten||0) || a.naam.localeCompare(b.naam))

  const assistsTop5 = [...teamSpelers]
    .sort((a,b)=>(b.assists||0)-(a.assists||0) || a.naam.localeCompare(b.naam))
    .slice(0,5).map(sp=>({sp, waarde:(sp.assists||0)}));
  const opkomstTop5 = [...teamSpelers]
    .map(sp=>({sp, waarde:getOpkomstSpeler(sp.id).pct}))
    .sort((a,b)=>b.waarde-a.waarde || a.sp.naam.localeCompare(b.sp.naam))
    .slice(0,5);
  return`

      ${topLijst('Assists', '<i class="ti ti-shoe" style="font-size:16px;color:var(--fcb-groen)"></i>', assistsTop5)}

    </div>`;
}

function sortSpelers(lijst){
  if(spelersSort==='rugnummer') return [...lijst].sort((a,b)=>(parseInt(a.nr)||999)-(parseInt(b.nr)||999));
  if(spelersSort==='naam') return [...lijst].sort((a,b)=>a.naam.localeCompare(b.naam));
  // positie: keeper eerst, dan verdedigers, midden, aanval
  const volgorde=['Keeper','Rechtsback','Centrale verdediger','Linksback','Def. middenvelder','Centrale middenvelder','Aanvallende mid.','Rechtsbuiten','Linksbuiten','Spits'];
  return [...lijst].sort((a,b)=>{
    const ai=volgorde.indexOf(a.pos); const bi=volgorde.indexOf(b.pos);
    if(ai===bi) return (parseInt(a.nr)||999)-(parseInt(b.nr)||999);
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });
}

let spelersTab='profiel';
let addBlessureForm=false;
let nextBlesId=10;

function slaaBlessureOp(spelerId){
  const naam=document.getElementById('bles-naam')?.value.trim();
  const start=document.getElementById('bles-start')?.value;
  const eind=document.getElementById('bles-eind')?.value||'';
  if(!naam||!start) return;
  const sp=spelers.find(s=>s.id===spelerId);
  sp.blessures.push({id:nextBlesId++,naam,startdatum:start,einddatum:eind});
  if(!eind) sp.status='geblesseerd';
  addBlessureForm=false;
  draw();
}

function deleteBlessure(spelerId,blesId){
  const sp=spelers.find(s=>s.id===spelerId);
  sp.blessures=sp.blessures.filter(b=>b.id!==blesId);
  if(!sp.blessures.find(b=>!b.einddatum)) sp.status='beschikbaar';
  draw();
}

function setEinddatum(spelerId,blesId){
  const today=new Date().toISOString().split('T')[0];
  const sp=spelers.find(s=>s.id===spelerId);
  sp.blessures.find(b=>b.id===blesId).einddatum=today;
  if(!sp.blessures.find(b=>!b.einddatum)) sp.status='beschikbaar';
  draw();
}

function toggleSkillVis(spelerId,cat){
  const sp=spelers.find(s=>s.id===spelerId);
  sp.skillVis[cat]=!sp.skillVis[cat];
  draw();
}


// ---- WEDSTRIJDEN ----
function renderWedstrijden(){
  const gs=wedstrijden.filter(w=>w.status==='gespeeld');
  const w=gs.filter(w=>w.score&&w.score.e>w.score.t).length;
  const g=gs.filter(w=>w.score&&w.score.e===w.score.t).length;
  const v=gs.filter(w=>w.score&&w.score.e<w.score.t).length;
  const df=gs.reduce((s,w)=>s+(w.score?w.score.e-w.score.t:0),0);
  const rows=wedstrijden.map(w=>`
    <div class="match-row" onclick="activeWedstrijdId=${w.id};wedstrijdTab='opstelling';draw()">
      <div style="font-size:12px;color:var(--text-muted)">${fmtDate(w.datum)}</div>
      <div>
        <div style="font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          FC Binnenmaas 1
          <span class="score ${scClass(w)}">${w.status==='live'?`<span class="live-badge"><i class="ti ti-circle-filled" style="font-size:8px"></i> LIVE</span> ${w.score.e}-${w.score.t}`:w.score?`${w.score.e}-${w.score.t}`:'–'}</span>
          ${w.teg}
        </div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap">
          <span class="${w.thuis?'badge-thuis':'badge-uit'}">${w.thuis?'Thuis':'Uit'}</span>
          <span class="type-badge">${w.type}</span>
        </div>
      </div>
      <i class="ti ti-chevron-right" style="color:var(--text-muted)"></i>
    </div>`).join('');
  return`
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val" style="color:var(--fcb-groen)">${w}</div><div class="stat-lbl">Gewonnen</div></div>
      <div class="stat-box"><div class="stat-val">${g}</div><div class="stat-lbl">Gelijk</div></div>
      <div class="stat-box"><div class="stat-val">${v}</div><div class="stat-lbl">Verloren</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${df>=0?'var(--fcb-groen)':'#dc2626'}">${df>0?'+':''}${df}</div><div class="stat-lbl">Doelsaldo</div></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div class="card-title"><div class="gdot"></div>Alle wedstrijden (${wedstrijden.length})</div>
        <button class="btn-green" style="font-size:12px;padding:6px 12px" onclick="toonNieuweWedstrijd=!toonNieuweWedstrijd;draw()"><i class="ti ti-plus" style="font-size:13px"></i> Toevoegen</button>
      </div>
      ${toonNieuweWedstrijd?renderNieuweWedstrijd():''}
      ${rows}
    </div>`;
}

    tabContent = renderWedstrijdOpstelling(w, gepland);

function renderWedstrijdSelectie(w){
  const teamSpelers = spelers.filter(s=>s.type==='team');
  const telling = {};
  SELECTIE_OPTIES.forEach(o=>telling[o]=0);
  teamSpelers.forEach(s=>telling[getSelectieStatus(w,s.id)]++);

  const rijen = teamSpelers.map(sp=>{
    const status = getSelectieStatus(w,sp.id);
    const opties = SELECTIE_OPTIES.map(o=>`
      <button onclick="setSelectieStatus(wedstrijden.find(x=>x.id===${w.id}),${sp.id},'${o}')"
        style="padding:4px 9px;border-radius:99px;font-size:11px;cursor:pointer;font-family:inherit;
          border:1px solid ${status===o?SELECTIE_KLEUR[o]:'var(--border)'};
          background:${status===o?SELECTIE_KLEUR[o]:'var(--white)'};
          color:${status===o?'#fff':'var(--text-muted)'};
          font-weight:${status===o?'600':'400'}">${SELECTIE_LABELS[o]}</button>`).join('');
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:10px;margin-bottom:7px;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:9px;min-width:170px;flex:1">
        ${sp.nr?`<span class="nr-badge">${sp.nr}</span>`:''}
        <span style="font-size:13.5px;font-weight:600">${sp.naam}</span>
        <span class="pos-pill">${sp.pos}</span>
      </div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${opties}</div>
    </div>`;
  }).join('');

  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem">
      ${SELECTIE_OPTIES.map(o=>`<span style="font-size:12px;padding:5px 12px;border-radius:99px;background:${SELECTIE_KLEUR[o]}18;color:${SELECTIE_KLEUR[o]};font-weight:600">${SELECTIE_LABELS[o]}: ${telling[o]}</span>`).join('')}
    </div>
    ${rijen}`;
}

// ---- OPSTELLING (maken indien gepland, bekijken indien gespeeld) ----
function renderWedstrijdOpstelling(w, bewerkbaar){
  const f=FORMATIES[w.formatie]||FORMATIES['4-3-3'];
  const beschikbaar = beschikbareSelectie(w);
  const opgesteld = new Set(Object.values(w.opstellingPos).filter(Boolean).map(Number));

  // Veld met posities
  let svgNodes='';
  f.pos.forEach((pos,i)=>{
    const cx=12+(pos[0]/100)*196, cy=290-(pos[1]/100)*260;
    const isGK=i===0;
    const spelerId=w.opstellingPos[i];
    const sp=spelerId?spelers.find(s=>s.id===Number(spelerId)):null;
    if(sp){
      svgNodes+=`<g${bewerkbaar?` style="cursor:pointer" onclick="opstellingKlik(${w.id},${i})"`:''}>
        <circle cx="${cx}" cy="${cy}" r="13" fill="${isGK?'#D4A017':'#185FA5'}" stroke="white" stroke-width="1.5"/>
        <text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="9" font-weight="600" font-family="system-ui">${sp.nr||''}</text>
        <text x="${cx}" y="${cy+20}" text-anchor="middle" fill="white" font-size="8" font-family="system-ui" opacity=".9">${achternaam(sp.naam)}</text>
        <text x="${cx}" y="${cy-18}" text-anchor="middle" fill="rgba(255,255,255,.65)" font-size="7.5" font-family="system-ui">${f.labels[i]}</text>
      </g>`;
    } else {
      svgNodes+=`<g${bewerkbaar?` style="cursor:pointer" onclick="opstellingKlik(${w.id},${i})"`:''}>
        <circle cx="${cx}" cy="${cy}" r="13" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.6)" stroke-width="1.5" stroke-dasharray="3 2"/>
        ${bewerkbaar?`<text x="${cx}" y="${cy+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="14" font-weight="400" font-family="system-ui">+</text>`:''}
        <text x="${cx}" y="${cy-18}" text-anchor="middle" fill="rgba(255,255,255,.65)" font-size="7.5" font-family="system-ui">${f.labels[i]}</text>
      </g>`;
    }
  });

  const veld = `<div class="field-outer">
    <svg viewBox="0 0 220 320" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block">
      <defs><pattern id="gr" x="0" y="0" width="220" height="32" patternUnits="userSpaceOnUse"><rect width="220" height="16" fill="#2a5c17"/><rect y="16" width="220" height="16" fill="#2d6319"/></pattern></defs>
      <rect width="220" height="320" fill="url(#gr)" rx="6"/>
      <rect x="12" y="12" width="196" height="296" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5" rx="2"/>
      <line x1="12" y1="160" x2="208" y2="160" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <circle cx="110" cy="160" r="30" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <rect x="55" y="12" width="110" height="44" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <rect x="55" y="264" width="110" height="44" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      ${svgNodes}
    </svg>
  </div>`;

  // Zijpaneel: bij bewerkbaar tonen we selectie-info + bank; anls bekijken tonen we opstelling-lijst
  let zijpaneel='';
  if(bewerkbaar){
    const bankIcoontjes = (w.wisselBank||[]).map(id=>{
      const sp=spelers.find(s=>s.id===Number(id));
      if(!sp) return '';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:60px;position:relative">
        <button onclick="verwijderVanBank(${w.id},${sp.id})" title="Verwijderen" style="position:absolute;top:-4px;right:2px;width:16px;height:16px;border-radius:50%;background:#dc2626;color:#fff;border:none;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;padding:0;line-height:1;z-index:2"><i class="ti ti-x" style="font-size:9px"></i></button>
        ${spelerCirkel(sp.nr)}
        <span style="font-size:10px;color:var(--text-muted);text-align:center;line-height:1.15;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${achternaam(sp.naam)}</span>
      </div>`;
    }).join('');
    const bankBlok = (w.wisselBank||[]).length>0
      ? `<div style="display:flex;flex-wrap:wrap;gap:10px 6px;padding:10px;background:var(--bg);border-radius:10px">${bankIcoontjes}</div>`
      : '<div style="font-size:12px;color:var(--text-light);padding:4px">Nog geen wissels</div>';

    const nietOpgesteld = beschikbaar.filter(s=>!opgesteld.has(s.id) && !(w.wisselBank||[]).map(Number).includes(s.id));
    zijpaneel = `
      <div>
        <div class="sec-lbl">Formatie</div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem">
          ${Object.keys(FORMATIES).map(ff=>`<span onclick="wijzigWedstrijdFormatie(${w.id},'${ff}')" style="padding:4px 10px;border-radius:var(--radius);font-size:12px;cursor:pointer;border:1px solid ${w.formatie===ff?'var(--fcb-groen)':'var(--border)'};background:${w.formatie===ff?'var(--fcb-groen-licht)':'var(--white)'};color:${w.formatie===ff?'#1B5E20':'var(--text-muted)'};font-weight:${w.formatie===ff?'600':'400'}">${ff}</span>`).join('')}
        </div>
        <div class="sec-lbl">Basiself (${opgesteld.size}/11)</div>
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:1rem">Klik op een positie in het veld om een speler te kiezen.</div>
        <div class="sec-lbl">Wissels (${(w.wisselBank||[]).length})</div>
        ${bankBlok}
        ${nietOpgesteld.length>0?`<button class="btn-outline" style="width:100%;justify-content:center;margin-top:8px;font-size:12px" onclick="openBankKiezer(${w.id})"><i class="ti ti-plus" style="font-size:13px"></i> Speler aan wissels toevoegen</button>`:''}
      </div>`;
  } else {
    // Bekijken: toon opstelling als lijst
    const rijen = f.labels.map((lbl,i)=>{
      const spelerId=w.opstellingPos[i];
      const sp=spelerId?spelers.find(s=>s.id===Number(spelerId)):null;
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--bg);border-radius:8px;margin-bottom:5px">
        <div style="width:26px;height:26px;border-radius:50%;background:${i===0?'#D4A017':'var(--fcb-groen)'};color:white;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600">${sp?sp.nr||'':''}</div>
        <span style="font-size:13px;flex:1">${sp?sp.naam:'<span style=\'color:var(--text-light)\'>—</span>'}</span>
        <span style="font-size:11px;color:var(--text-muted);background:#f3f4f6;padding:1px 7px;border-radius:99px">${lbl}</span>
      </div>`;
    }).join('');
    const bank=(w.wisselBank||[]).map(id=>{
      const sp=spelers.find(s=>s.id===Number(id));
      if(!sp) return '';
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:60px">
        ${spelerCirkel(sp.nr)}
        <span style="font-size:10px;color:var(--text-muted);text-align:center;line-height:1.15;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${achternaam(sp.naam)}</span>
      </div>`;
    }).join('');
    zijpaneel=`<div>
      <div class="sec-lbl">Opstelling — ${w.formatie}</div>
      ${rijen}
      ${bank?`<div class="sec-lbl" style="margin-top:1rem">Wissels</div><div style="display:flex;flex-wrap:wrap;gap:10px 6px;padding:10px;background:var(--bg);border-radius:10px">${bank}</div>`:''}
    </div>`;
  }

  return `<div class="opstelling-veld-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;align-items:start">
    ${veld}
    ${zijpaneel}
  </div>`;
}

// ---- EVENTS (gespeelde wedstrijd) ----

    :w.events.map(e=>{
      if(e.type==='wissel'){
        const uit=spelers.find(s=>s.id===Number(e.uit)), inSp=spelers.find(s=>s.id===Number(e.in));

          <span class="event-min">${e.min}'</span>
          <i class="ti ti-arrows-exchange" style="color:#0369a1;font-size:15px;flex-shrink:0"></i>
          <span style="font-size:13px"><span style="color:#dc2626">${uit?uit.naam:'?'}</span> → <span style="color:var(--fcb-groen)">${inSp?inSp.naam:'?'}</span></span>
        </div>`;
      }
      return `<div class="event-row">

// ---- SPEELMINUTEN (gespeelde wedstrijd) ----
function renderWedstrijdSpeelminuten(w){
  // Vul speelminuten indien nog leeg (op basis van opstelling+wissels)
  if(Object.keys(w.speelminuten).length===0) syncSpeelminuten(w);
  // Toon alle spelers die meededen (opstelling + wissels)
  const meegedaan = new Set([...Object.values(w.opstellingPos).filter(Boolean).map(Number), ...(w.wisselBank||[]).map(Number)]);
  const lijst = spelers.filter(s=>s.type==='team' && meegedaan.has(s.id));
  if(lijst.length===0) return `<div style="text-align:center;padding:1.5rem;color:var(--text-muted);font-size:13px">Geen opstelling bekend — stel eerst een opstelling samen.</div>`;
  const rijen = lijst.map(sp=>{
    const min = w.speelminuten[sp.id] ?? 0;
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:10px;margin-bottom:6px">
      ${sp.nr?`<span class="nr-badge">${sp.nr}</span>`:''}
      <span style="font-size:13.5px;font-weight:600;flex:1">${sp.naam}</span>
      <input type="number" min="0" max="120" value="${min}" onchange="setSpeelminuten(${w.id},${sp.id},this.value)"
        style="width:64px;text-align:center;border:1px solid var(--border);border-radius:8px;padding:6px;font-family:inherit;font-size:13px">
      <span style="font-size:12px;color:var(--text-muted);width:28px">min</span>
    </div>`;
  }).join('');
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
      <div class="sec-lbl" style="margin:0">Speelminuten per speler</div>
      <button class="btn-outline" style="font-size:12px" onclick="herberekenSpeelminuten(${w.id})"><i class="ti ti-refresh" style="font-size:13px"></i> Herbereken uit opstelling</button>
    </div>
    ${rijen}`;
}


// ---- LIVE WEDSTRIJD ----
function startWedstrijd(wedstrijdId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  // Controleer of er een basiself is
  const aantalOpgesteld = Object.values(w.opstellingPos).filter(Boolean).length;
  if(aantalOpgesteld===0){
    showToast('Stel eerst een opstelling samen');
    wedstrijdTab='opstelling';
    draw();
    return;
  }
  w.status='live';
  if(!w.score) w.score={e:0,t:0};
  klokPhase='voor'; klokElapsed=0; klokStart=null;
  draw();
}

function renderWedstrijdLive(w){
  const cl=klokLabel();
  const isActive=klokPhase==='eerste'||klokPhase==='tweede';
  const minNu = Math.floor(klokSeconds()/60);

  // Spelers op het veld (basiself minus reeds uitgewisseld, plus ingevallen)
  const uitgewisseld = new Set((w.wissels||[]).map(ws=>Number(ws.uit)));
  const ingevallen = (w.wissels||[]).map(ws=>Number(ws.in));
  const opVeld = [...Object.values(w.opstellingPos).filter(Boolean).map(Number), ...ingevallen].filter(id=>!uitgewisseld.has(id));

        }
        return `<div class="event-row"><span class="event-min">${e.min}\'</span><i class="ti ti-ball-football" style="color:var(--fcb-groen);font-size:15px"></i><span>${e.speler}${e.assist&&e.assist!=='geen'?` <span style="font-size:11px;color:var(--text-muted)">(assist: ${e.assist})</span>`:''}</span></div>`;

        <div style="text-align:right;flex:1"><div style="font-size:14px;font-weight:600">FC Binnenmaas 1</div></div>
        <div style="font-size:38px;font-weight:700;min-width:90px">${w.score.e} - ${w.score.t}</div>

      </div>
      ${cl.extra?`<div style="font-size:11px;color:#dc2626;font-weight:600">Blessuretijd</div>`:''}
      <div class="clock-display" style="font-size:24px;font-weight:700;color:var(--fcb-groen)">${cl.display}</div>
      <div style="margin-top:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">

        ${klokPhase==='eerste'?`<button style="background:#E8C400;color:#1a1a1a;border:none;border-radius:var(--radius);padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit" onclick="startRust()"><i class="ti ti-player-pause" style="font-size:12px"></i> Rust</button>`:''}

        ${klokPhase==='tweede'?`<button style="background:#dc2626;color:white;border:none;border-radius:var(--radius);padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit" onclick="floitAf(${w.id})"><i class="ti ti-whistle" style="font-size:12px"></i> Affluiten</button>`:''}

function floitAf(wedstrijdId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  clearInterval(klokInterval); klokStart=null; klokPhase='afgelopen';
  w.status='gespeeld';
  syncSpeelminuten(w);
  // Update doelpunten/assists tellingen op spelers
  activeWedstrijdId=w.id; wedstrijdTab='speelminuten';
  showToast('Wedstrijd opgeslagen');
  draw();
}

// Doelpunt registreren
function openDoelpunt(wedstrijdId){ liveActie={type:'doelpunt', wedstrijdId, kant:'eigen', speler:null}; draw(); }
function openWissel(wedstrijdId){ liveActie={type:'wissel', wedstrijdId, uit:null, in:null}; draw(); }
function sluitLiveActie(){ liveActie=null; draw(); }

function registreerDoelpunt(wedstrijdId, kant, spelerId, assistId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  const min = Math.floor(klokSeconds()/60);
  if(kant==='eigen'){
    w.score.e++;
    const sp=spelers.find(s=>s.id===Number(spelerId));
    const assist=assistId&&assistId!=='geen'?spelers.find(s=>s.id===Number(assistId)):null;
    w.events.push({type:'doelpunt', min, speler:sp?sp.naam:'Onbekend', assist:assist?assist.naam:'geen'});
    if(sp) sp.doelpunten=(sp.doelpunten||0)+1;
    if(assist) assist.assists=(assist.assists||0)+1;
  } else {
    w.score.t++;
    w.events.push({type:'doelpunt', min, speler:w.teg, assist:'geen', tegen:true});
  }
  liveActie=null;
  draw();
}

function registreerWissel(wedstrijdId, uitId, inId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  const min = Math.floor(klokSeconds()/60);
  w.wissels.push({min, uit:Number(uitId), in:Number(inId)});
  liveActie=null;
  draw();
}

          ${sp.nr?`<span class="nr-badge">${sp.nr}</span>`:''}<span style="font-size:13px;font-weight:600;flex:1">${sp.naam}</span>${Number(liveActie.speler)===sp.id?'<i class="ti ti-check" style="color:var(--fcb-groen)"></i>':''}
        </button>`).join('');
      const assistOpties = liveActie.speler ? `
        <div class="sec-lbl" style="margin-top:1rem">Assist (optioneel)</div>
        <select id="assistSelect" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;margin-bottom:1rem">
          <option value="geen">Geen assist</option>
          ${opVeld.filter(s=>s.id!==Number(liveActie.speler)).map(s=>`<option value="${s.id}">${s.naam}</option>`).join('')}
        </select>
        <button class="btn-green" style="width:100%;justify-content:center" onclick="registreerDoelpunt(${w.id},'eigen',${liveActie.speler},document.getElementById('assistSelect').value)">Doelpunt registreren (${min}')</button>` : '';
      keuze = `<div class="sec-lbl">Doelpuntenmaker</div>${spelerKnoppen}${assistOpties}`;

// ---- WEDSTRIJD OPSTELLING/SELECTIE ACTIES ----
function opstellingKlik(wedstrijdId, posIndex){
  const w = wedstrijden.find(x=>x.id===wedstrijdId);
  if(!isGepland(w)) return; // alleen bewerkbaar indien gepland
  // Als er al een speler staat: verwijder hem (klik = leegmaken/opnieuw kiezen)
  opstellingKiezer = {wedstrijdId, posIndex};
  draw();
}
function openBankKiezer(wedstrijdId){
  opstellingKiezer = {wedstrijdId, bank:true};
  draw();
}
function sluitOpstellingKiezer(){ opstellingKiezer=null; draw(); }

function kiesSpelerVoorPositie(wedstrijdId, spelerId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  if(!opstellingKiezer) return;
  if(opstellingKiezer.bank){
    if(!w.wisselBank.map(Number).includes(Number(spelerId))) w.wisselBank.push(Number(spelerId));
  } else {
    const pi = opstellingKiezer.posIndex;
    // verwijder deze speler van een andere positie of van de bank (geen dubbelen)
    Object.keys(w.opstellingPos).forEach(k=>{ if(Number(w.opstellingPos[k])===Number(spelerId)) delete w.opstellingPos[k]; });
    w.wisselBank = w.wisselBank.filter(id=>Number(id)!==Number(spelerId));
    w.opstellingPos[pi] = Number(spelerId);
  }
  opstellingKiezer=null;
  draw();
}
function maakPositieLeeg(wedstrijdId, posIndex){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  delete w.opstellingPos[posIndex];
  opstellingKiezer=null;
  draw();
}
function verwijderVanBank(wedstrijdId, spelerId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  w.wisselBank = w.wisselBank.filter(id=>Number(id)!==Number(spelerId));
  draw();
}
function wijzigWedstrijdFormatie(wedstrijdId, formatie){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  w.formatie = formatie;
  draw();
}
function setSpeelminuten(wedstrijdId, spelerId, waarde){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  w.speelminuten[spelerId] = Math.max(0, Math.min(120, parseInt(waarde)||0));
  draw();
}
function herberekenSpeelminuten(wedstrijdId){
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===wedstrijdId));
  syncSpeelminuten(w);
  showToast('Speelminuten herberekend');
  draw();

function renderOpstellingKiezer(){
  if(!opstellingKiezer) return '';
  const w = ensureWedstrijdVelden(wedstrijden.find(x=>x.id===opstellingKiezer.wedstrijdId));
  const f = FORMATIES[w.formatie]||FORMATIES['4-3-3'];
  const opgesteld = new Set(Object.values(w.opstellingPos).filter(Boolean).map(Number));
  const opBank = new Set((w.wisselBank||[]).map(Number));
  const beschikbaar = beschikbareSelectie(w);
  const titel = opstellingKiezer.bank ? 'Speler aan wissels toevoegen' : `Kies speler voor ${f.labels[opstellingKiezer.posIndex]}`;
  const huidige = !opstellingKiezer.bank ? w.opstellingPos[opstellingKiezer.posIndex] : null;

  const rijen = beschikbaar.map(sp=>{
    const bezet = opgesteld.has(sp.id) || opBank.has(sp.id);
    const isHuidige = Number(huidige)===sp.id;
    return `<button onclick="kiesSpelerVoorPositie(${w.id},${sp.id})" title="${sp.naam} · ${sp.pos}"

      ${spelerCirkel(sp.nr)}
      <span style="font-size:10px;color:var(--text-muted);text-align:center;line-height:1.15;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${achternaam(sp.naam)}</span>
    </button>`;
  }).join('') || '<div style="font-size:13px;color:var(--text-light);padding:1rem;text-align:center">Geen beschikbare spelers. Zet spelers eerst op \'Aanwezig\' in de Selectie-tab.</div>';

  return `<div onclick="if(event.target===this)sluitOpstellingKiezer()" style="position:fixed;inset:0;background:rgba(15,23,41,0.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem">
    <div style="background:#fff;border-radius:16px;padding:1.25rem;max-width:440px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.3)">

        <div style="font-size:15px;font-weight:700">${titel}</div>
        <button onclick="sluitOpstellingKiezer()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px"><i class="ti ti-x"></i></button>
      </div>
      ${huidige?`<button onclick="maakPositieLeeg(${w.id},${opstellingKiezer.posIndex})" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;font-family:inherit;background:#fff;color:#dc2626;font-size:13px"><i class="ti ti-trash" style="font-size:14px"></i> Positie leegmaken</button>`:''}

    </div>
  </div>`;
}

const FILTERS=[
  {key:'all',label:'Alles',        days:null},
  {key:'w1', label:'Laatste week', days:7},
  {key:'m1', label:'Laatste maand',days:30},
  {key:'m3', label:'3 maanden',    days:90},
  {key:'m6', label:'6 maanden',    days:180},
];

let expandedSubs={};
let subFilters={};

function daysAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0];}
function filterBeelden(beelden,fk){
  const f=FILTERS.find(x=>x.key===fk)||FILTERS[0];
  if(!f.days) return beelden;
  const cutoff=daysAgo(f.days);
  return beelden.filter(b=>b.datum&&b.datum>=cutoff);
}
function fmtDateB(d){if(!d)return'—';const[y,m,day]=d.split('-');return`${day}-${m}-${y}`;}
function getSub(subId){for(const cat of CATS){const s=cat.subs.find(s=>s.id===subId);if(s)return s;}return null;}
function getCatForSub(subId){return CATS.find(cat=>cat.subs.some(s=>s.id===subId));}

              <div style="display:grid;grid-template-columns:130px 1fr;gap:8px;margin-bottom:8px">

  return spelerSwitch+catCards;
}

function slaBeeldOp(subId){
  const url=document.getElementById(`bd-url-${subId}`)?.value.trim();
  if(!url) return;
  const datum=document.getElementById(`bd-datum-${subId}`)?.value||'';
  const opmerking=document.getElementById(`bd-opm-${subId}`)?.value.trim()||'';
  const sub=getSub(subId);
  if(sub) sub.beelden.push({id:'b'+(beeldIdCounter++),datum,url,opmerking});
  addBeeldIn=null;
  draw();
}

function deletBeeld(subId,beeldId){
  const sub=getSub(subId);
  if(sub) sub.beelden=sub.beelden.filter(b=>b.id!==beeldId);
  draw();
}

function slaClubOp(){
  const naam=document.getElementById('clubNaamInput')?.value.trim();

  closeBeheer();
  showToast('Clubnaam opgeslagen');
}

function activeerSeizoen(id){
  seizoenen.forEach(s=>s.actief=false);
  seizoenen.find(s=>s.id===id).actief=true;
  document.getElementById('seizoenLabel').textContent=seizoenen.find(s=>s.id===id).naam;
  draw();
}

function verwijderSeizoen(id){
  const s=seizoenen.find(x=>x.id===id);
  if(s.actief) return;
  seizoenen.splice(seizoenen.indexOf(s),1);
  draw();
}

function addSeizoen(){
  const el=document.getElementById('nieuwSeizoenInput');
  const naam=el?.value.trim();
  if(!naam) return;
  seizoenen.push({id:nextSeizoenId++,naam,actief:false});
  el.value='';
  draw();
}

function vindPionDichtbij(items, x, y, drempel){
  for(const item of (items||[])){
    if(item.type!=='pion'||item.pionId===undefined) continue;
    const dx=item.x-x, dy=item.y-y;
    if(Math.sqrt(dx*dx+dy*dy)<=drempel) return item;
  }
  return null;
}

// ---- TRAININGEN HELPERS ----
function getAanwezigheid(training, spelerId){
  return training.aanwezigheid[spelerId] || 'aanwezig';
}


function setAanwezigheid(trainingId, spelerId, status){
  const t = trainingen.find(x=>x.id===trainingId);
  if(!t) return;
  const huidig = getAanwezigheid(t, spelerId);
  if(status==='aanwezig' && huidig==='aanwezig'){
    // uitvinken = niet geselecteerd
    t.aanwezigheid[spelerId] = 'Niet geselecteerd';
  } else if(status==='aanwezig'){
    delete t.aanwezigheid[spelerId]; // aanwezig = standaard, geen opslag nodig
  } else {
    t.aanwezigheid[spelerId] = status;
  }
  draw();
}

function getOpkomstSpeler(spelerId){
  const now = new Date().toISOString().split('T')[0];
  const selectie = trainingen.filter(t=>{
    if(t.datum > now) return false;
    if(t.geannuleerd) return false;
    if(getAanwezigheid(t,spelerId)==='Niet geselecteerd') return false; // niet meetellen
    if(trainingsFilter==='alle') return true;
    return t.datum.startsWith(trainingsFilter);
  });
  const aanwezig = selectie.filter(t=>getAanwezigheid(t,spelerId)==='aanwezig').length;
  return {aanwezig, totaal:selectie.length, pct: selectie.length?Math.round(aanwezig/selectie.length*100):0};
}

function getFilteredTrainingen(){
  const now = new Date().toISOString().split('T')[0];
  let lijst = trainingen;
  if(trainingsFilter!=='alle') lijst = lijst.filter(t=>t.datum.startsWith(trainingsFilter));
  return lijst;
}

function getMaanden(){
  const maanden = [...new Set(trainingen.map(t=>t.datum.slice(0,7)))];
  return maanden;
}

function fmtMaand(m){
  const [y,mo] = m.split('-');
  const namen = ['','Jan','Feb','Mrt','Apr','Mei','Jun','Jul','Aug','Sep','Okt','Nov','Dec'];
  return namen[parseInt(mo)] + ' ' + y;
}
