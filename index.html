      const kleur = opkomstKleur(o.pct);
      const bg    = opkomstBg(o.pct);
      return `<div onclick="activeSpelerTrainingId=${sp.id};draw()" style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--white);border-radius:var(--radius);margin-bottom:6px;border:1px solid var(--border);cursor:pointer">
        ${sp.foto
          ?`<img src="${sp.foto}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;flex-shrink:0" alt="">`
          :`<div style="width:40px;height:40px;border-radius:6px;background:var(--fcb-groen-licht);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--fcb-groen);flex-shrink:0">${sp.init}</div>`}
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600">${sp.naam}</div>
          <div style="font-size:11px;color:var(--text-muted)">${sp.pos} · ${o.aanwezig}/${o.totaal} trainingen</div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:22px;font-weight:700;color:${kleur};line-height:1">${o.pct}%</div>
          <div style="font-size:11px;font-weight:600;color:${kleur}">${opkomstLabel(o.pct)}</div>
        </div>
        <i class="ti ti-chevron-right" style="font-size:13px;color:var(--text-muted);flex-shrink:0"></i>
      </div>`;
    }).join('');

    return `<div class="card">
      <div class="card-hdr">
        <div class="card-title"><div class="gdot"></div>Opkomst per speler</div>
        <span style="font-size:11px;color:var(--text-muted)">Laagste opkomst eerst</span>
      </div>
      ${filterBar}${viewToggle}
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem">
        <div style="background:var(--fcb-groen-licht);border-radius:var(--radius);padding:12px;text-align:center">
          <div style="font-size:24px;font-weight:700;color:#1B5E20">${gemiddeld}%</div>
          <div style="font-size:11px;color:#1B5E20">Gem. opkomst</div>
        </div>
        <div style="background:#f9f9f9;border-radius:var(--radius);padding:12px;text-align:center;border:1px solid var(--border)">
          <div style="font-size:24px;font-weight:700">${aantalGeweest}</div>
          <div style="font-size:11px;color:var(--text-muted)">Trainingen geweest</div>
        </div>
        <div style="background:#f9f9f9;border-radius:var(--radius);padding:12px;text-align:center;border:1px solid var(--border)">
          <div style="font-size:24px;font-weight:700">${selectieSpelers.length}</div>
          <div style="font-size:11px;color:var(--text-muted)">Spelers</div>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-bottom:1rem;font-size:11px;flex-wrap:wrap">
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#1B5E20;display:inline-block"></span> ≥85% Goed</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#78610a;display:inline-block"></span> 75–85% Matig</span>
        <span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:#dc2626;display:inline-block"></span> &lt;75% Laag</span>
      </div>
      ${rijen}
    </div>`;
  }
  // Per training overzicht
  // Split in verleden/vandaag en toekomst
  const verleden = gefilterd.filter(t=>t.datum<=now).reverse();
  const toekomst = gefilterd.filter(t=>t.datum>now);

  const renderTrainingRij = (t,isPast,isVandaag) => {
    const isGeannuleerd = t.geannuleerd||false;
    const geselecteerd = selectieSpelers.filter(sp=>getAanwezigheid(t,sp.id)!=='Niet geselecteerd');
    const aantalAanwezig = geselecteerd.filter(sp=>getAanwezigheid(t,sp.id)==='aanwezig').length;
    const aantalAfwezig = geselecteerd.filter(sp=>getAanwezigheid(t,sp.id)!=='aanwezig').length;
    const aantalNietGes = selectieSpelers.length - geselecteerd.length;
    const pct = geselecteerd.length ? Math.round(aantalAanwezig/geselecteerd.length*100) : 0;
    // Heeft iemand een afwijkende status tov standaard (aanwezig)?
    const heeftWijzigingen = Object.keys(t.aanwezigheid||{}).length > 0;
    return `
      <div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:${isGeannuleerd?'#fef2f2':isVandaag?'var(--fcb-groen-licht)':isPast?'#f9f9f9':'var(--white)'};border-radius:var(--radius);margin-bottom:6px;border:1px solid ${isGeannuleerd?'#fca5a5':isVandaag?'var(--fcb-groen)':'var(--border)'};cursor:pointer" onclick="activeTrainingId=${t.id};activeOefeningId=null;draw()">
        <div style="flex-shrink:0;text-align:center;min-width:52px">
          <div style="font-size:11px;color:var(--text-muted)">${t.dag}</div>
          <div style="font-size:13px;font-weight:700;${isGeannuleerd?'text-decoration:line-through;color:var(--text-muted)':''}">${fmtDate(t.datum)}</div>
          <div style="font-size:10px;color:var(--text-muted)">${t.tijd}</div>
        </div>
        <div style="flex:1">
          ${isGeannuleerd?`<span style="font-size:11px;color:#dc2626;font-weight:600">Geannuleerd</span>`:''}
          ${!isGeannuleerd?`
            <div style="font-size:12px;color:var(--text-muted)">
              ${isPast||isVandaag
                ?`<span style="color:${pct>=85?'#1B5E20':pct>=75?'#78610a':'#dc2626'};font-weight:600">${pct}%</span>&nbsp;
                  ${aantalAanwezig} aanwezig${aantalAfwezig>0?` · <span style="color:#dc2626">${aantalAfwezig} afwezig</span>`:''}${aantalNietGes>0?` · ${aantalNietGes} niet ges.`:''}`
                :heeftWijzigingen
                  ?`${geselecteerd.length} geselecteerd · <span style="color:#1B5E20">${aantalAanwezig} aanwezig</span>${aantalAfwezig>0?` · <span style="color:#dc2626">${aantalAfwezig} afwezig</span>`:''}${aantalNietGes>0?` · ${aantalNietGes} niet ges.`:''}`
                  :`Alle ${selectieSpelers.length} geselecteerd`}
            </div>
          `:''}
        </div>
        ${isVandaag&&!isGeannuleerd?`<span style="font-size:10px;background:var(--fcb-groen);color:white;padding:2px 8px;border-radius:99px">Vandaag</span>`:''}
        <i class="ti ti-chevron-right" style="font-size:13px;color:var(--text-muted);flex-shrink:0"></i>
      </div>`;
  };

  const trainingRijen =
    (verleden.length>0?verleden.map(t=>renderTrainingRij(t,t.datum<now,t.datum===now)).join(''):'') +
    (toekomst.length>0?`
      <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border)">
        <div style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Geplande trainingen</div>
        ${(toonAlleToekomst?toekomst:toekomst.slice(0,5)).map(t=>renderTrainingRij(t,false,false)).join('')}
        ${toekomst.length>5?`<div onclick="toonAlleToekomst=!toonAlleToekomst;draw()" style="font-size:12px;color:var(--fcb-groen);text-align:center;margin-top:6px;cursor:pointer;padding:6px;border:1px solid var(--fcb-groen);border-radius:var(--radius);background:var(--fcb-groen-licht)">${toonAlleToekomst?'Minder tonen ↑':'+ '+(toekomst.length-5)+' meer geplande trainingen tonen ↓'}</div>`:''}
      </div>`:'');

  if(activeTrainingId){
    const t = trainingen.find(x=>x.id===activeTrainingId);
    const isGeannuleerd = t.geannuleerd||false;
    const isPast = t.datum<=now;
    const isToekomst = t.datum>now;

    const geselecteerdDetail = selectieSpelers.filter(sp=>getAanwezigheid(t,sp.id)!=='Niet geselecteerd');
    const aantalAanwezig = geselecteerdDetail.filter(sp=>getAanwezigheid(t,sp.id)==='aanwezig').length;
    const aantalAfwezigDetail = geselecteerdDetail.length - aantalAanwezig;
    const aantalNietGesDetail = selectieSpelers.length - geselecteerdDetail.length;
    const opkomstPct = geselecteerdDetail.length ? Math.round(aantalAanwezig/geselecteerdDetail.length*100) : 0;

    // --- Aanwezigheidslijst ---
    const spelerRijen = selectieSpelers.map(sp=>{
      const status = getAanwezigheid(t,sp.id);
      const isAfwezig = status!=='aanwezig'&&status!=='Niet geselecteerd';
      const isNietGes = status==='Niet geselecteerd';
      return `
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;
          background:${isNietGes?'#f3f4f6':isAfwezig?'#fef2f2':'#f9f9f9'};
          border-radius:var(--radius);margin-bottom:6px;
          border:1px solid ${isNietGes?'#d1d5db':isAfwezig?'#fca5a5':'var(--border)'};
          opacity:${isNietGes?'0.55':'1'}">
          ${sp.foto
            ?`<img src="${sp.foto}" style="width:32px;height:32px;border-radius:6px;object-fit:cover;flex-shrink:0" alt="">`
            :`<div style="width:32px;height:32px;border-radius:6px;background:${isNietGes?'#e5e7eb':isAfwezig?'#fef2f2':'var(--fcb-groen-licht)'};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:${isNietGes?'#6b7280':isAfwezig?'#dc2626':'var(--fcb-groen)'};flex-shrink:0">${sp.init}</div>`}
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${sp.naam}</div>
            <div style="font-size:11px;color:var(--text-muted)">${sp.pos}</div>
          </div>
          ${!isGeannuleerd?`<div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
            <span onclick="setAanwezigheid(${t.id},${sp.id},'aanwezig')"
              title="${status==='aanwezig'?'Klik om uit te vinken':'Klik om aanwezig te zetten'}"
              style="padding:4px 12px;border-radius:99px;font-size:11px;cursor:pointer;
                border:1px solid ${status==='aanwezig'?'var(--fcb-groen)':'var(--border)'};
                background:${status==='aanwezig'?'var(--fcb-groen)':'var(--white)'};
                color:${status==='aanwezig'?'white':'var(--text-muted)'}">
              ${status==='aanwezig'?'✓ Aanwezig':'○ Aanwezig'}
            </span>
            ${AFWEZIGHEIDSREDENEN.map(r=>`
              <span onclick="setAanwezigheid(${t.id},${sp.id},'${r}')"
                style="padding:4px 12px;border-radius:99px;font-size:11px;cursor:pointer;
                  border:1px solid ${status===r?'#dc2626':'var(--border)'};
                  background:${status===r?'#dc2626':'var(--white)'};
                  color:${status===r?'white':'var(--text-muted)'}">${r}</span>`).join('')}
          </div>`:`<span style="font-size:11px;color:var(--text-muted);font-style:italic">Geannuleerd</span>`}
        </div>`;
    }).join('');

    // --- Inklapbare sectie helper ---
    const accordion = (key, icon, label, badge, badgeBg, badgeColor, inhoud) => `
      <div style="border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden">
        <div onclick="trainingMenuOpen['${key}']=!trainingMenuOpen['${key}'];draw()"
          style="display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;
            background:${trainingMenuOpen[key]?'var(--fcb-groen-licht)':'var(--white)'};
            border-bottom:${trainingMenuOpen[key]?'1px solid var(--fcb-groen)':'none'}">
          <i class="ti ti-${icon}" style="font-size:16px;color:${trainingMenuOpen[key]?'var(--fcb-groen)':'var(--text-muted)'}"></i>
          <span style="font-size:14px;font-weight:600;flex:1;color:${trainingMenuOpen[key]?'var(--fcb-groen)':'var(--text-primary)'}">${label}</span>
          ${badge!==null?`<span style="font-size:11px;padding:2px 8px;border-radius:99px;background:${badgeBg};color:${badgeColor};font-weight:600">${badge}</span>`:''}
          <i class="ti ti-chevron-${trainingMenuOpen[key]?'up':'down'}" style="font-size:13px;color:var(--text-muted)"></i>
        </div>
        ${trainingMenuOpen[key]?`<div style="padding:12px 14px">${inhoud}</div>`:''}
      </div>`;

    // Stats samenvatting
    const statsHtml = !isGeannuleerd?`
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem">
        <div style="background:var(--fcb-groen-licht);border-radius:var(--radius);padding:10px;text-align:center">
          <div style="font-size:22px;font-weight:700;color:#1B5E20">${aantalAanwezig}</div>
          <div style="font-size:11px;color:#1B5E20">Aanwezig</div>
        </div>
        <div style="background:${aantalAfwezigDetail>0?'#fef2f2':'#f9f9f9'};border-radius:var(--radius);padding:10px;text-align:center;border:1px solid ${aantalAfwezigDetail>0?'#fca5a5':'var(--border)'}">
          <div style="font-size:22px;font-weight:700;color:${aantalAfwezigDetail>0?'#dc2626':'var(--text-muted)'}">${aantalAfwezigDetail}</div>
          <div style="font-size:11px;color:${aantalAfwezigDetail>0?'#dc2626':'var(--text-muted)'}">Afwezig</div>
        </div>
        <div style="background:#f9f9f9;border-radius:var(--radius);padding:10px;text-align:center;border:1px solid var(--border)">
          <div style="font-size:22px;font-weight:700;color:var(--text-muted)">${aantalNietGesDetail}</div>
          <div style="font-size:11px;color:var(--text-muted)">Niet ges.</div>
        </div>
        <div style="background:#f9f9f9;border-radius:var(--radius);padding:10px;text-align:center;border:1px solid var(--border)">
          <div style="font-size:22px;font-weight:700;color:${geselecteerdDetail.length?opkomstPct>=85?'#1B5E20':opkomstPct>=75?'#78610a':'#dc2626':'var(--text-muted)'}">${isPast?opkomstPct+'%':'—'}</div>
          <div style="font-size:11px;color:var(--text-muted)">Opkomst</div>
        </div>
      </div>`
      :`<div style="background:#fef2f2;border:1px solid #fca5a5;border-radius:var(--radius);padding:12px 16px;margin-bottom:1rem;font-size:13px;color:#dc2626;display:flex;align-items:center;gap:8px">
        <i class="ti ti-ban" style="font-size:16px"></i>Deze training is geannuleerd.
      </div>`;

    // Badge tekst voor aanwezigheid
    const aanwBadge = `${aantalAanwezig}/${geselecteerdDetail.length} aanwezig`;

    return `
      <div class="card">
        <div class="card-hdr">
          <div style="display:flex;flex-direction:column;gap:3px">
            <div class="card-title">
              <div class="gdot" style="${isGeannuleerd?'background:#dc2626':''}"></div>
              ${t.dag} ${fmtDate(t.datum)} — ${t.tijd}
              ${isGeannuleerd?`<span style="font-size:10px;background:#fef2f2;color:#dc2626;border:1px solid #fca5a5;padding:2px 8px;border-radius:99px;margin-left:6px">Geannuleerd</span>`:''}
              ${isToekomst&&!isGeannuleerd?`<span style="font-size:10px;background:#f3f4f6;color:var(--text-muted);padding:2px 8px;border-radius:99px;margin-left:6px">Gepland</span>`:''}
            </div>
          </div>
          <div style="display:flex;gap:6px">
            <button onclick="annuleerTraining(${t.id})" style="font-size:12px;padding:5px 12px;border-radius:var(--radius);
              border:1px solid ${isGeannuleerd?'var(--fcb-groen)':'#fca5a5'};
              background:${isGeannuleerd?'var(--fcb-groen-licht)':'#fef2f2'};
              color:${isGeannuleerd?'#1B5E20':'#dc2626'};
              cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px">
              <i class="ti ti-${isGeannuleerd?'rotate':'ban'}" style="font-size:13px"></i>
              ${isGeannuleerd?'Herplannen':'Annuleren'}
            </button>
            <button class="btn-outline" style="font-size:12px;padding:5px 12px" onclick="activeTrainingId=null;draw()">
              <i class="ti ti-arrow-left" style="font-size:12px"></i> Terug
            </button>
          </div>
        </div>

        ${statsHtml}

        ${accordion('aanwezigheid','users','Aanwezigheid',aanwBadge,'var(--fcb-groen-licht)','#1B5E20',spelerRijen)}
        ${accordion('voorbereiding','clipboard','Training voorbereiden','Staf',
          '#e0f2fe','#0369a1',
          trainingMenuOpen['voorbereiding']?renderVoorbereidingInhoud(t.id):'')}
      </div>`;
  }

  return `
    <div class="card">
      <div class="card-hdr"><div class="card-title"><div class="gdot"></div>Trainingsopkomst</div></div>
      ${filterBar}${viewToggle}
      ${trainingRijen}
    </div>`;
}


// ---- OEFENING FUNCTIES ----
function getOefeningen(trainingId){
  return oefeningen[trainingId] || [];
}




function slaOefeningOp(trainingId){
  const naam = document.getElementById('oef-naam-input')?.value.trim();
  if(!naam) return;
  if(!oefeningen[trainingId]) oefeningen[trainingId] = [];
  oefeningen[trainingId].push({
    id: nextOefeningId++,
    naam,
    veld: nieuwOefening.veld,
    teams: nieuwOefening.teams.map(t=>({...t, spelers:[...(t.spelers||[])]})),
    items: [...(nieuwOefening.items||[])],
    opmerking: nieuwOefening.opmerking||'',
    verbindingen: [...(nieuwOefening.verbindingen||[])],
  });
  const saved = oefeningen[trainingId][oefeningen[trainingId].length-1];
  toonNieuweOefening = null;
  nieuwOefening = {naam:'', veld:'heel', teams:[], items:[], opmerking:'', verbindingen:[]}; laatsteGeplaatstePionId=null;
  activeOefeningId = saved.id;
  bewerkModus = false;
  geselecteerdPlaatsItem = null;
  draw();
}

function verwijderOefening(trainingId, oefId){
  if(oefeningen[trainingId]){
    oefeningen[trainingId] = oefeningen[trainingId].filter(o=>o.id!==oefId);
    draw();
  }
}function renderVoorbereidingInhoud(trainingId){
  const lijst = getOefeningen(trainingId);
  const t = trainingen.find(x=>x.id===trainingId);
  const aanwezigen = spelers.filter(s=>s.type!=='staf')
    .filter(sp=>(t?getAanwezigheid(t,sp.id)==='aanwezig':true));

  const VELD_OPTIES = [{key:'heel',label:'Heel veld'},{key:'half',label:'Half veld'},{key:'kwart',label:'Kwart veld'}];

  // ---- VELD EDITOR (oefening open) ----
  if(activeOefeningId!==null){
    const oef = (oefeningen[trainingId]||[]).find(o=>o.id===activeOefeningId);
    if(!oef){ activeOefeningId=null; draw(); return ''; }

    const VW=280;
    const VH=oef.veld==='heel'?430:oef.veld==='half'?215:135;

    const veldLijnen = oef.veld==='heel'?`
      <line x1="8" y1="${VH/2}" x2="${VW-8}" y2="${VH/2}" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
      <rect x="${VW/2-50}" y="8" width="100" height="55" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <rect x="${VW/2-50}" y="${VH-63}" width="100" height="55" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <rect x="${VW/2-22}" y="8" width="44" height="22" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
      <rect x="${VW/2-22}" y="${VH-30}" width="44" height="22" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
    `:oef.veld==='half'?`
      <rect x="${VW/2-50}" y="8" width="100" height="55" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <rect x="${VW/2-22}" y="8" width="44" height="22" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
      <path d="M ${VW/2-45} 63 Q ${VW/2} 90 ${VW/2+45} 63" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.5"/>
    `:``;

    // Render geplaatste items (altijd, ook in weergavemodus)
    const geplaatsteItems=(oef.items||[]).map((item,idx)=>{
      if(item.type==='speler'){
        const voornaam = (item.naam||'').split(' ')[0];
        const naamEscE = (item.naam||'').replace(/'/g,'');
        const pw = voornaam.length * 5.5 + 12;
        const ph = 14;
        return `<g style="cursor:${bewerkModus?'grab':'default'}"
          ${bewerkModus?`data-speler-id="${item.spelerId}" data-kleur="${item.teamKleur}" data-naam="${naamEscE}" data-init="${item.init||''}"
          onmousedown="handleSpelerOpVeldMouseDown(event,${trainingId},${oef.id},'editor',${idx})"`:''}>
          <rect x="${item.x-pw/2}" y="${item.y-ph/2}" width="${pw}" height="${ph}" rx="${ph/2}"
            fill="${item.teamKleur}"/>
          <text x="${item.x-4}" y="${item.y+1}" text-anchor="middle" dominant-baseline="middle"
            fill="white" font-size="8" font-weight="700" font-family="system-ui" style="pointer-events:none">${voornaam}</text>
          ${bewerkModus?`<text x="${item.x+pw/2-6}" y="${item.y+1}" text-anchor="middle" dominant-baseline="middle"
            fill="rgba(255,255,255,0.8)" font-size="10" font-weight="700" font-family="system-ui"
            style="cursor:pointer" onclick="event.stopPropagation();verwijderItemVeld(${trainingId},${oef.id},${idx})">×</text>`:''}
        </g>`;
      } else if(item.type==='pion'){
        const r=item.groot?9:5;
        const rg=item.groot?4:2;
        return `<g${bewerkModus?` style="cursor:pointer" onclick="verwijderItem(${trainingId},${oef.id},${idx})" title="Klik om te verwijderen"`:''}>
          <circle cx="${item.x}" cy="${item.y}" r="${r}" fill="${item.kleur}"/>
          <circle cx="${item.x}" cy="${item.y}" r="${rg}" fill="white"/>
        </g>`;
      } else if(item.type==='pijl'||item.type==='pijl_streep'){
        const ex=item.ex||item.x+40, ey=item.ey||item.y-20;
        const cx=item.cx!==undefined?item.cx:(item.x+ex)/2;
        const cy=item.cy!==undefined?item.cy:(item.y+ey)/2;
        const mid=`arr${trainingId}_${oef.id}_${idx}`;
        const isDragging = dragPijl && dragPijl.trainingId===trainingId && dragPijl.oefId===oef.id && dragPijl.idx===idx;
        const vmx = Math.round(0.25*item.x + 0.5*cx + 0.25*ex);
        const vmy = Math.round(0.25*item.y + 0.5*cy + 0.25*ey);
        const isStreep = item.type==='pijl_streep';
        return `<g>
          <defs><marker id="${mid}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="white"/></marker></defs>
          <path d="M ${item.x} ${item.y} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="white" stroke-width="2" marker-end="url(#${mid})"/>
          ${bewerkModus?`
          <path d="M ${item.x} ${item.y} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="transparent" stroke-width="12"
            style="cursor:pointer" onclick="verwijderItem(${trainingId},${oef.id},${idx})" title="Klik om te verwijderen"/>
          <circle cx="${vmx}" cy="${vmy}" r="3" fill="${isDragging?'rgba(255,220,0,0.9)':'rgba(255,255,255,0.85)'}" stroke="rgba(255,255,255,0.9)" stroke-width="1"
            style="cursor:grab"
            onclick="event.stopPropagation()"
            onmousedown="event.stopPropagation();startDragPijl(event,${trainingId},${oef.id},${idx})"
            ontouchstart="event.stopPropagation();startDragPijlTouch(event,${trainingId},${oef.id},${idx})"/>`:''}
        </g>`;
      } else if(item.type==='nummer'){
        return `<g${bewerkModus?` style="cursor:pointer" onclick="verwijderItem(${trainingId},${oef.id},${idx})" title="Klik om te verwijderen"`:''}>
          <circle cx="${item.x}" cy="${item.y}" r="9" fill="rgba(0,0,0,0.5)" stroke="white" stroke-width="1"/>
          <text x="${item.x}" y="${item.y+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="9" font-weight="700" font-family="system-ui">${item.nummer}</text>
        </g>`;
      } else if(item.type==='klein_doel'){
        const dw=18, dh=12;
        return `<g${bewerkModus?` style="cursor:pointer" onclick="verwijderItem(${trainingId},${oef.id},${idx})" title="Klik om te verwijderen"`:''}>
          <path d="M${item.x-dw/2} ${item.y-dh/2} L${item.x-dw/2} ${item.y+dh/2} M${item.x-dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y-dh/2} M${item.x+dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y+dh/2}" fill="none" stroke="white" stroke-width="2" stroke-linecap="square"/>
          <line x1="${item.x-dw/2+6}" y1="${item.y-dh/2}" x2="${item.x-dw/2+6}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2+12}" y1="${item.y-dh/2}" x2="${item.x-dw/2+12}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2}" y1="${item.y-dh/6}" x2="${item.x+dw/2}" y2="${item.y-dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2}" y1="${item.y+dh/6}" x2="${item.x+dw/2}" y2="${item.y+dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        </g>`;
      } else if(item.type==='groot_doel'){
        const dw=28, dh=18;
        return `<g${bewerkModus?` style="cursor:pointer" onclick="verwijderItem(${trainingId},${oef.id},${idx})" title="Klik om te verwijderen"`:''}>
          <path d="M${item.x-dw/2} ${item.y-dh/2} L${item.x-dw/2} ${item.y+dh/2} M${item.x-dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y-dh/2} M${item.x+dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y+dh/2}" fill="none" stroke="white" stroke-width="2" stroke-linecap="square"/>
          <line x1="${item.x-dw/2+7}" y1="${item.y-dh/2}" x2="${item.x-dw/2+7}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2+14}" y1="${item.y-dh/2}" x2="${item.x-dw/2+14}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2+21}" y1="${item.y-dh/2}" x2="${item.x-dw/2+21}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2}" y1="${item.y-dh/6}" x2="${item.x+dw/2}" y2="${item.y-dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
          <line x1="${item.x-dw/2}" y1="${item.y+dh/6}" x2="${item.x+dw/2}" y2="${item.y+dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        </g>`;
      }
      return '';
    }).join('');

    const actiefItem = bewerkModus && geselecteerdPlaatsItem && geselecteerdPlaatsItem.oefId===oef.id ? geselecteerdPlaatsItem : null;

    // ---- WEERGAVE MODUS ----
    if(!bewerkModus){
      // Teams weergave
      const teamsHtml = oef.teams.length>0 ? oef.teams.map(team=>`
        <div style="margin-bottom:8px">
          <div style="font-size:12px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:6px">
            <span style="width:10px;height:10px;border-radius:50%;background:${team.kleur};display:inline-block"></span>
            ${team.naam}
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${(team.spelers||[]).map(spId=>{
              const sp=spelers.find(s=>s.id===spId);
              return sp?`<span style="font-size:11px;padding:2px 10px;border-radius:99px;background:${team.kleur};color:white">${sp.naam.split(' ')[0]}</span>`:'';
            }).join('')}
            ${(team.spelers||[]).length===0?`<span style="font-size:11px;color:var(--text-muted);font-style:italic">Geen spelers gekoppeld</span>`:''}
          </div>
        </div>`).join('') : `<div style="font-size:12px;color:var(--text-muted);font-style:italic">Geen teams</div>`;

      return `
        <div class="card">
          <div class="card-hdr">
            <div>
              <div class="card-title"><div class="gdot"></div>${oef.naam}
                <span style="font-size:11px;background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:99px;margin-left:6px">${oef.veld} veld</span>
              </div>
            </div>
            <div style="display:flex;gap:6px">
              <button onclick="bewerkModus=true;geselecteerdPlaatsItem=null;draw()"
                class="btn-green" style="font-size:12px;padding:5px 14px">
                <i class="ti ti-pencil" style="font-size:13px"></i> Bewerken
              </button>
              <button class="btn-outline" style="font-size:12px;padding:5px 12px"
                onclick="activeOefeningId=null;bewerkModus=false;geselecteerdPlaatsItem=null;draw()">
                <i class="ti ti-arrow-left" style="font-size:12px"></i> Terug
              </button>
            </div>
          </div>
          ${oef.opmerking?`<div style="background:#f9f9f9;border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px;color:var(--text);white-space:pre-wrap">${oef.opmerking}</div>`:''}
          <div style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start">
            <svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg"
              style="width:100%;border-radius:var(--radius);display:block">
              <defs><pattern id="gras${oef.id}" x="0" y="0" width="${VW}" height="35" patternUnits="userSpaceOnUse">
                <rect width="${VW}" height="17" fill="#2a5c17"/><rect y="17" width="${VW}" height="18" fill="#2d6319"/>
              </pattern></defs>
              <rect width="${VW}" height="${VH}" fill="url(#gras${oef.id})" rx="4"/>
              <rect x="8" y="8" width="${VW-16}" height="${VH-16}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
              ${veldLijnen}
              ${genereerVastePionLijnen(oef.items, oef.verbindingen)}
              ${geplaatsteItems}
            </svg>
            <div style="min-width:140px">${teamsHtml}</div>
          </div>
        </div>`;
    }

    // ---- BEWERK MODUS ----
    // Item knoppen zijpaneel
    const PION_KLEUREN = [{k:'#E8C400',n:'Geel'},{k:'#185FA5',n:'Blauw'},{k:'#f97316',n:'Oranje'}];
    let zijpaneel = '<div class="sec-lbl">Pionnen</div>';
    PION_KLEUREN.forEach(pc => {
      ['klein','groot'].forEach(maat => {
        const groot = maat==='groot';
        const r = groot?9:5;
        const isActief = actiefItem&&actiefItem.type==='pion'&&actiefItem.groot===groot&&actiefItem.kleur===pc.k;
        zijpaneel += `<button onclick="plaatsItem(${trainingId},${oef.id},'pion',${groot},'${pc.k}')"
          style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius);width:100%;margin-bottom:4px;
            border:1.5px solid ${isActief?pc.k:'var(--border)'};background:${isActief?pc.k+'22':'var(--white)'};
            cursor:pointer;font-family:inherit;font-size:12px;color:var(--text)">
          <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="${r}" fill="${pc.k}"/><circle cx="10" cy="10" r="${groot?4:2}" fill="white"/></svg>
          ${pc.n} ${maat}${isActief?' ✓':''}
        </button>`;
      });
    });

    zijpaneel += '<div class="sec-lbl" style="margin-top:8px">Doelen</div>';
    [{type:'klein_doel',label:'Klein doel',dw:18,dh:12},{type:'groot_doel',label:'Groot doel',dw:28,dh:18}].forEach(d => {
      const isActief = actiefItem&&actiefItem.type===d.type;
      const bw = d.dw+10, bh = d.dh+8;
      const ox = bw/2, oy = bh/2;
      const vl = Math.floor(d.dw/6);
      const netV = Array.from({length:Math.floor(d.dw/vl)-1},(_,i)=>`<line x1="${ox-d.dw/2+(i+1)*vl}" y1="${oy-d.dh/2}" x2="${ox-d.dw/2+(i+1)*vl}" y2="${oy+d.dh/2}" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>`).join('');
      const netH = `<line x1="${ox-d.dw/2}" y1="${oy-d.dh/6}" x2="${ox+d.dw/2}" y2="${oy-d.dh/6}" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/><line x1="${ox-d.dw/2}" y1="${oy+d.dh/6}" x2="${ox+d.dw/2}" y2="${oy+d.dh/6}" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>`;
      zijpaneel += `<button onclick="plaatsItem(${trainingId},${oef.id},'${d.type}',false,'#1a1a1a')"
        style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius);width:100%;margin-bottom:4px;
          border:1.5px solid ${isActief?'#1a1a1a':'var(--border)'};background:${isActief?'#f3f4f6':'var(--white)'};
          cursor:pointer;font-family:inherit;font-size:12px;color:var(--text)">
        <svg width="${bw}" height="${bh}" viewBox="0 0 ${bw} ${bh}">
          <path d="M${ox-d.dw/2} ${oy-d.dh/2} L${ox-d.dw/2} ${oy+d.dh/2} M${ox-d.dw/2} ${oy-d.dh/2} L${ox+d.dw/2} ${oy-d.dh/2} M${ox+d.dw/2} ${oy-d.dh/2} L${ox+d.dw/2} ${oy+d.dh/2}" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="square"/>
          ${netV}${netH}
        </svg>
        ${d.label}${isActief?' ✓':''}
      </button>`;
    });

    const volgendNummer = Math.max(0,...(oef.items||[]).filter(i=>i.type==='nummer').map(i=>i.nummer||0))+1;
    const nummerActief = actiefItem&&actiefItem.type==='nummer';
    const pijlActief = actiefItem&&actiefItem.type==='pijl';
    const pijlStreepActief = actiefItem&&actiefItem.type==='pijl_streep';

    zijpaneel += `<div class="sec-lbl" style="margin-top:8px">Overig</div>
      <button onclick="plaatsItem(${trainingId},${oef.id},'nummer',false,'white')"
        style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius);width:100%;margin-bottom:4px;
          border:1.5px solid ${nummerActief?'#6366f1':'var(--border)'};background:${nummerActief?'#6366f122':'var(--white)'};
          cursor:pointer;font-family:inherit;font-size:12px;color:var(--text)">
        <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="rgba(0,0,0,0.4)" stroke="white" stroke-width="1"/><text x="10" y="11" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="9" font-weight="700" font-family="system-ui">${volgendNummer}</text></svg>
        Nummer${nummerActief?' ✓':''}
      </button>
      <button onclick="plaatsItem(${trainingId},${oef.id},'pijl',false,'white')"
        style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius);width:100%;margin-bottom:4px;
          border:1.5px solid ${pijlActief?'#1a1a1a':'var(--border)'};background:${pijlActief?'#f3f4f6':'var(--white)'};
          cursor:pointer;font-family:inherit;font-size:12px;color:var(--text)">
        <svg width="30" height="18" viewBox="0 0 30 18"><defs><marker id="arrprev" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><polygon points="0,0 5,2.5 0,5" fill="#1a1a1a"/></marker></defs><line x1="2" y1="14" x2="24" y2="4" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arrprev)"/></svg>
        Pijl${pijlActief?(pijlStart?' (klik eindpunt)':' (klik startpunt)'):''}${pijlActief?' ✓':''}
      </button>
      <button onclick="toggleVerwijderModus()"
        style="display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:var(--radius);width:100%;margin-bottom:4px;margin-top:2px;
          border:1.5px solid ${verwijderModus?'#dc2626':'var(--border)'};background:${verwijderModus?'#fee2e2':'var(--white)'};
          cursor:pointer;font-family:inherit;font-size:12px;color:${verwijderModus?'#dc2626':'var(--text)'}">
        <i class="ti ti-trash" style="font-size:15px"></i>
        Verwijderen${verwijderModus?' (actief — klik item)':''}
      </button>
`;

    zijpaneel += '<div class="divider"></div><div class="sec-lbl">Teams</div>';
    Object.entries(TEAM_KLEUREN).forEach(([naam,kleur]) => {
      const heeftTeam = oef.teams.some(t=>t.kleur===kleur);
      const label = naam.charAt(0).toUpperCase()+naam.slice(1);
      zijpaneel += `<span onclick="toggleTeamInOefening(${trainingId},${oef.id},'${kleur}','${label}')"
        style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;margin:2px;
          border:2px solid ${kleur};background:${heeftTeam?kleur:'var(--white)'};color:${heeftTeam?'white':kleur};font-weight:600">
        ${heeftTeam?'&#10003; ':''} ${label}
      </span>`;
    });

    if(oef.teams.length>0){
      zijpaneel += '<div style="margin-top:8px">';
      oef.teams.forEach(team => {
        zijpaneel += '<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:600;color:var(--text-muted);margin-bottom:3px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:'+team.kleur+';display:inline-block"></span>'+team.naam+'</div><div style="display:flex;flex-wrap:wrap;gap:3px">';
        (team.spelers||[]).forEach(spId => {
          const sp = spelers.find(s=>s.id===spId);
          if(!sp) return;
          const init = sp.naam.split(' ').map(w=>w[0]).join('').substring(0,3).toUpperCase();
          const opVeld = (oef.items||[]).some(i=>i.type==='speler'&&i.spelerId===sp.id);
          const kleurEsc = team.kleur.replace('#','');
          const naamEsc = sp.naam.replace(/'/g,'');
          zijpaneel += `<span
            data-speler-id="${sp.id}" data-kleur="${team.kleur}" data-naam="${naamEsc}" data-init="${init}"
            onmousedown="handleSpelerMouseDown(event)"
            style="font-size:10px;padding:2px 8px;border-radius:99px;background:${team.kleur};color:white;cursor:grab;user-select:none;display:inline-block;margin-bottom:2px;opacity:${opVeld?0.5:1}"
            title="Sleep naar het veld">
            ${sp.naam.split(' ')[0]}
            <span onclick="event.stopPropagation();ontkoppelSpeler(${trainingId},${oef.id},${team.id},${sp.id})" style="opacity:0.8;cursor:pointer">×</span>
          </span>`;
        });
        aanwezigen.filter(sp=>!oef.teams.some(t2=>t2.spelers&&t2.spelers.includes(sp.id))).forEach(sp => {
          zijpaneel += '<span onclick="koppelSpelerAanTeam('+trainingId+','+oef.id+','+team.id+','+sp.id+')" style="font-size:10px;padding:2px 7px;border-radius:99px;background:#f3f4f6;color:var(--text-muted);cursor:pointer;border:1px dashed '+team.kleur+'">+ '+sp.naam.split(' ')[0]+'</span>';
        });
        zijpaneel += '</div></div>';
      });
      zijpaneel += '</div>';
    }

    return `
      <div class="card">
        <div class="card-hdr">
          <div style="font-size:14px;font-weight:600">${oef.naam}
            <span style="font-size:11px;background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:99px;margin-left:6px">${oef.veld} veld</span>
          </div>
          <div style="display:flex;gap:6px">
            <button onclick="bewerkModus=false;geselecteerdPlaatsItem=null;pijlStart=null;draw()"
              class="btn-outline" style="font-size:12px;padding:5px 12px">
              <i class="ti ti-check" style="font-size:12px"></i> Klaar
            </button>
            <button class="btn-outline" style="font-size:12px;padding:5px 12px"
              onclick="activeOefeningId=null;bewerkModus=false;geselecteerdPlaatsItem=null;pijlStart=null;draw()">
              <i class="ti ti-arrow-left" style="font-size:12px"></i> Terug
            </button>
          </div>
        </div>
        <div class="veld-nieuw-grid" style="display:grid;grid-template-columns:1fr 170px;gap:14px;align-items:start">
          <div>
            ${actiefItem?`<div style="font-size:11px;color:#1B5E20;background:var(--fcb-groen-licht);padding:6px 10px;border-radius:var(--radius);margin-bottom:6px">
              ${(actiefItem.type==='pijl'||actiefItem.type==='pijl_streep')?(pijlStart?'Klik eindpunt op het veld':'Klik startpunt op het veld'):'Klik op het veld om te plaatsen — klik item om te verwijderen'}
            </div>`:`<div style="font-size:11px;color:var(--text-muted);margin-bottom:6px">Selecteer een item rechts om te plaatsen</div>`}
            <svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg"
              data-veld="editor" data-training="${trainingId}" data-oef="${oef.id}"
              style="width:100%;border-radius:var(--radius);cursor:${actiefItem?'crosshair':'default'};display:block;border:2px solid ${actiefItem?'var(--fcb-groen)':'transparent'}"
              onclick="handleVeldKlik(event,${trainingId},${oef.id})"
              onmousemove="handleVeldMuisBeweging(event)"
              onmouseleave="muisVeldPos=null;tekenAfstandLijn()">
              <defs><pattern id="gras${oef.id}" x="0" y="0" width="${VW}" height="35" patternUnits="userSpaceOnUse">
                <rect width="${VW}" height="17" fill="#2a5c17"/><rect y="17" width="${VW}" height="18" fill="#2d6319"/>
              </pattern></defs>
              <rect width="${VW}" height="${VH}" fill="url(#gras${oef.id})" rx="4"/>
              <rect x="8" y="8" width="${VW-16}" height="${VH-16}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
              ${veldLijnen}
              ${genereerVastePionLijnen(oef.items, oef.verbindingen)}
              ${geplaatsteItems}
              ${(pijlStart&&actiefItem&&(actiefItem.type==='pijl'||actiefItem.type==='pijl_streep'))?`<circle cx="${pijlStart.x}" cy="${pijlStart.y}" r="4" fill="white" opacity="0.8"/>`:''}
            </svg>
          </div>
          <div>${zijpaneel}</div>
        </div>
      </div>`;
  }


  // ---- OEFENING LIJST ----
  const oefeningKaarten = lijst.map(o=>`
    <div style="background:#f9f9f9;border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:pointer"
      onclick="activeOefeningId=${o.id};bewerkModus=false;geselecteerdPlaatsItem=null;draw()">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:14px;font-weight:600">${o.naam}</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap">
            <span style="background:#e0f2fe;color:#0369a1;padding:1px 7px;border-radius:99px">${o.veld} veld</span>
            ${o.teams.map(t=>`<span style="background:${t.kleur};color:white;padding:1px 7px;border-radius:99px">${t.naam}</span>`).join('')}
          </div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <i class="ti ti-chevron-right" style="font-size:14px;color:var(--text-muted)"></i>
          <button onclick="event.stopPropagation();verwijderOefening(${trainingId},${o.id})"
            style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:15px;padding:2px">
            <i class="ti ti-trash"></i>
          </button>
        </div>
      </div>
    </div>`).join('');

  // ---- NIEUW FORMULIER ----
  const formulier = toonNieuweOefening===trainingId
    ? renderNieuweOefeningForm(trainingId, aanwezigen)
    : '';

  return `
    ${oefeningKaarten}
    ${formulier}
    ${toonNieuweOefening!==trainingId?`
      <button onclick="toonNieuweOefening=${trainingId};nieuwOefening={naam:'',veld:'heel',teams:[]};draw()"
        class="btn-outline" style="width:100%;justify-content:center;font-size:13px">
        <i class="ti ti-plus" style="font-size:14px;color:var(--fcb-groen)"></i> Oefening toevoegen
      </button>`:''}`;
}

function renderVeldPreview(veld){
  const VW=260, VH=veld==='heel'?400:veld==='half'?200:125;
  return `<svg viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg"
    style="width:100%;border-radius:var(--radius);display:block">
    <defs><pattern id="grprev" x="0" y="0" width="${VW}" height="34" patternUnits="userSpaceOnUse">
      <rect width="${VW}" height="17" fill="#2a5c17"/>
      <rect y="17" width="${VW}" height="17" fill="#2d6319"/>
    </pattern></defs>
    <rect width="${VW}" height="${VH}" fill="url(#grprev)" rx="4"/>
    <rect x="8" y="8" width="${VW-16}" height="${VH-16}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
    ${veld==='heel'?`
      <line x1="8" y1="${VH/2}" x2="${VW-8}" y2="${VH/2}" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
      <rect x="${VW/2-50}" y="8" width="100" height="55" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
      <rect x="${VW/2-50}" y="${VH-63}" width="100" height="55" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
    `:''}
    ${veld==='half'?`
      <rect x="${VW/2-50}" y="8" width="100" height="55" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
    `:''}
  </svg>`;
}


function renderNieuweOefeningForm(trainingId, aanwezigen){
  const VELD_OPTIES = [{key:'heel',label:'Heel veld'},{key:'half',label:'Half veld'},{key:'kwart',label:'Kwart veld'}];
  const PION_KLEUREN = [{k:'#E8C400',n:'Geel'},{k:'#185FA5',n:'Blauw'},{k:'#f97316',n:'Oranje'}];

  const VW=260;
  const VH=nieuwOefening.veld==='heel'?400:nieuwOefening.veld==='half'?200:125;
  const actiefItem = geselecteerdPlaatsItem && geselecteerdPlaatsItem.oefId==='nieuw' ? geselecteerdPlaatsItem : null;

  // Render geplaatste items op nieuw veld
  const geplaatsteItems=(nieuwOefening.items||[]).map((item,idx)=>{
    if(item.type==='speler'){
      const voornaam = (item.naam||'').split(' ')[0];
      const naamEscV = (item.naam||'').replace(/'/g,'');
      const pw = voornaam.length * 5.5 + 12;
      const ph = 14;
      return `<g style="cursor:grab"
        data-speler-id="${item.spelerId}" data-kleur="${item.teamKleur}" data-naam="${naamEscV}" data-init="${item.init||''}"
        onmousedown="handleSpelerOpVeldMouseDown(event,'nieuw',null,'nieuw',${idx})">
        <rect x="${item.x-pw/2}" y="${item.y-ph/2}" width="${pw}" height="${ph}" rx="${ph/2}"
          fill="${item.teamKleur}"/>
        <text x="${item.x-4}" y="${item.y+1}" text-anchor="middle" dominant-baseline="middle"
          fill="white" font-size="8" font-weight="700" font-family="system-ui" style="pointer-events:none">${voornaam}</text>
        <text x="${item.x+pw/2-6}" y="${item.y+1}" text-anchor="middle" dominant-baseline="middle"
          fill="rgba(255,255,255,0.8)" font-size="10" font-weight="700" font-family="system-ui"
          style="cursor:pointer" onclick="event.stopPropagation();verwijderNieuwItem(${idx})">×</text>
      </g>`;
    } else if(item.type==='pion'){
      const r=item.groot?9:5;
      const rg=item.groot?4:2;
      return `<g style="cursor:pointer" onclick="verwijderNieuwItem(${idx})" title="Verwijder">
        <circle cx="${item.x}" cy="${item.y}" r="${r}" fill="${item.kleur}"/>
        <circle cx="${item.x}" cy="${item.y}" r="${rg}" fill="white"/>
      </g>`;
    } else if(item.type==='nummer'){
      return `<g style="cursor:pointer" onclick="verwijderNieuwItem(${idx})" title="Verwijder"><circle cx="${item.x}" cy="${item.y}" r="9" fill="rgba(0,0,0,0.5)" stroke="white" stroke-width="1"/><text x="${item.x}" y="${item.y+1}" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="9" font-weight="700" font-family="system-ui">${item.nummer}</text></g>`;
    } else if(item.type==='klein_doel'){
      const dw=18, dh=12;
      return `<g style="cursor:pointer" onclick="verwijderNieuwItem(${idx})" title="Verwijder">
        <path d="M${item.x-dw/2} ${item.y-dh/2} L${item.x-dw/2} ${item.y+dh/2} M${item.x-dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y-dh/2} M${item.x+dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y+dh/2}" fill="none" stroke="white" stroke-width="2" stroke-linecap="square"/>
        <line x1="${item.x-dw/2+6}" y1="${item.y-dh/2}" x2="${item.x-dw/2+6}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2+12}" y1="${item.y-dh/2}" x2="${item.x-dw/2+12}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2}" y1="${item.y-dh/6}" x2="${item.x+dw/2}" y2="${item.y-dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2}" y1="${item.y+dh/6}" x2="${item.x+dw/2}" y2="${item.y+dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
      </g>`;
    } else if(item.type==='groot_doel'){
      const dw=28, dh=18;
      return `<g style="cursor:pointer" onclick="verwijderNieuwItem(${idx})" title="Verwijder">
        <path d="M${item.x-dw/2} ${item.y-dh/2} L${item.x-dw/2} ${item.y+dh/2} M${item.x-dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y-dh/2} M${item.x+dw/2} ${item.y-dh/2} L${item.x+dw/2} ${item.y+dh/2}" fill="none" stroke="white" stroke-width="2" stroke-linecap="square"/>
        <line x1="${item.x-dw/2+7}" y1="${item.y-dh/2}" x2="${item.x-dw/2+7}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2+14}" y1="${item.y-dh/2}" x2="${item.x-dw/2+14}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2+21}" y1="${item.y-dh/2}" x2="${item.x-dw/2+21}" y2="${item.y+dh/2}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2}" y1="${item.y-dh/6}" x2="${item.x+dw/2}" y2="${item.y-dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
        <line x1="${item.x-dw/2}" y1="${item.y+dh/6}" x2="${item.x+dw/2}" y2="${item.y+dh/6}" stroke="rgba(255,255,255,0.5)" stroke-width="0.8"/>
      </g>`;
    } else if(item.type==='pijl'||item.type==='pijl_streep'){
      const ex=item.ex||item.x+40, ey=item.ey||item.y-20;
      const cx=item.cx!==undefined?item.cx:(item.x+ex)/2;
      const cy=item.cy!==undefined?item.cy:(item.y+ey)/2;
      const mid='arrn'+idx;
      const isDragging = dragPijl && dragPijl.oefId==='nieuw' && dragPijl.idx===idx;
      const vmx = Math.round(0.25*item.x + 0.5*cx + 0.25*ex);
      const vmy = Math.round(0.25*item.y + 0.5*cy + 0.25*ey);
      const isStreep = item.type==='pijl_streep';
      return `<g ${isStreep?'data-streep="1"':''}>
        <defs><marker id="${mid}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="white"/></marker></defs>
        <path d="M ${item.x} ${item.y} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="transparent" stroke-width="12"
          style="cursor:pointer" onclick="verwijderNieuwItem(${idx})" title="Klik om te verwijderen"/>
        <path d="M ${item.x} ${item.y} Q ${cx} ${cy} ${ex} ${ey}" fill="none" stroke="white" stroke-width="2" marker-end="url(#${mid})"/>
        <circle cx="${vmx}" cy="${vmy}" r="3" fill="${isDragging?'rgba(255,220,0,0.9)':'rgba(255,255,255,0.85)'}" stroke="rgba(255,255,255,0.9)" stroke-width="1"
          style="cursor:grab"
          onclick="event.stopPropagation()"
          onmousedown="event.stopPropagation();startDragPijlNieuw(event,${idx})"
          ontouchstart="event.stopPropagation();startDragPijlNieuwTouch(event,${idx})"/>
      </g>`;
    }
    return '';
  }).join('');

  const veldLijnen = nieuwOefening.veld==='heel'?`
    <line x1="8" y1="${VH/2}" x2="${VW-8}" y2="${VH/2}" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
    <rect x="${VW/2-45}" y="8" width="90" height="50" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
    <rect x="${VW/2-45}" y="${VH-58}" width="90" height="50" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
    <rect x="${VW/2-20}" y="8" width="40" height="20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
    <rect x="${VW/2-20}" y="${VH-28}" width="40" height="20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
  `:nieuwOefening.veld==='half'?`
    <rect x="${VW/2-45}" y="8" width="90" height="50" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/>
    <rect x="${VW/2-20}" y="8" width="40" height="20" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1"/>
  `:'';

  // Zijpaneel items
  let zijItems = '<div class="sec-lbl">Pionnen</div>';
  PION_KLEUREN.forEach(pc => {
    ['klein','groot'].forEach(maat => {
      const groot = maat==='groot';
      const r = groot?9:5;
      const isActief = actiefItem&&actiefItem.type==='pion'&&actiefItem.groot===groot&&actiefItem.kleur===pc.k;
      zijItems += `<button onclick="plaatsNieuwItem('pion',${groot},'${pc.k}')"
        style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius);width:100%;margin-bottom:3px;
          border:1.5px solid ${isActief?pc.k:'var(--border)'};background:${isActief?pc.k+'22':'var(--white)'};
          cursor:pointer;font-family:inherit;font-size:11px;color:var(--text)">
        <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="${r}" fill="${pc.k}"/><circle cx="10" cy="10" r="${groot?4:2}" fill="white"/></svg>
        ${pc.n} ${maat}${isActief?' ✓':''}
      </button>`;
    });
  });

  zijItems += '<div class="sec-lbl" style="margin-top:6px">Doelen</div>';
  [{type:'klein_doel',label:'Klein doel',dw:18,dh:12},{type:'groot_doel',label:'Groot doel',dw:28,dh:18}].forEach(d => {
    const isActief = actiefItem&&actiefItem.type===d.type;
    const bw = d.dw+10, bh = d.dh+8;
    const ox = bw/2, oy = bh/2;
    const vl = Math.floor(d.dw/6);
    const netV = Array.from({length:Math.floor(d.dw/vl)-1},(_,i)=>`<line x1="${ox-d.dw/2+(i+1)*vl}" y1="${oy-d.dh/2}" x2="${ox-d.dw/2+(i+1)*vl}" y2="${oy+d.dh/2}" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>`).join('');
    const netH = `<line x1="${ox-d.dw/2}" y1="${oy-d.dh/6}" x2="${ox+d.dw/2}" y2="${oy-d.dh/6}" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/><line x1="${ox-d.dw/2}" y1="${oy+d.dh/6}" x2="${ox+d.dw/2}" y2="${oy+d.dh/6}" stroke="rgba(0,0,0,0.3)" stroke-width="0.8"/>`;
    zijItems += `<button onclick="plaatsNieuwItem('${d.type}',false,'#1a1a1a')"
      style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius);width:100%;margin-bottom:3px;
        border:1.5px solid ${isActief?'#1a1a1a':'var(--border)'};background:${isActief?'#f3f4f6':'var(--white)'};
        cursor:pointer;font-family:inherit;font-size:11px;color:var(--text)">
      <svg width="${bw}" height="${bh}" viewBox="0 0 ${bw} ${bh}">
        <path d="M${ox-d.dw/2} ${oy-d.dh/2} L${ox-d.dw/2} ${oy+d.dh/2} M${ox-d.dw/2} ${oy-d.dh/2} L${ox+d.dw/2} ${oy-d.dh/2} M${ox+d.dw/2} ${oy-d.dh/2} L${ox+d.dw/2} ${oy+d.dh/2}" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linecap="square"/>
        ${netV}${netH}
      </svg>
      ${d.label}${isActief?' ✓':''}
    </button>`;
  });

  const volgendNummer = Math.max(0,...(nieuwOefening.items||[]).filter(i=>i.type==='nummer').map(i=>i.nummer||0))+1;
  const numActief = actiefItem&&actiefItem.type==='nummer';
  const pijlActief = actiefItem&&actiefItem.type==='pijl';

  zijItems += `<div class="sec-lbl" style="margin-top:6px">Overig</div>
    <button onclick="plaatsNieuwItem('nummer',false,'white')"
      style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius);width:100%;margin-bottom:3px;
        border:1.5px solid ${numActief?'#6366f1':'var(--border)'};background:${numActief?'#6366f122':'var(--white)'};
        cursor:pointer;font-family:inherit;font-size:11px;color:var(--text)">
      <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="9" fill="rgba(0,0,0,0.4)" stroke="white" stroke-width="1"/><text x="10" y="11" text-anchor="middle" dominant-baseline="middle" fill="white" font-size="9" font-weight="700" font-family="system-ui">${volgendNummer}</text></svg>
      Nummer${numActief?' ✓':''}
    </button>`;
    const pijlStreepActiefN = actiefItem&&actiefItem.type==='pijl_streep';
    zijItems += `<button onclick="plaatsNieuwItem('pijl',false,'white')"
      style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius);width:100%;margin-bottom:3px;
        border:1.5px solid ${pijlActief?'#1a1a1a':'var(--border)'};background:${pijlActief?'#f3f4f6':'var(--white)'};
        cursor:pointer;font-family:inherit;font-size:11px;color:var(--text)">
      <svg width="30" height="18" viewBox="0 0 30 18"><defs><marker id="aprev" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><polygon points="0,0 5,2.5 0,5" fill="#1a1a1a"/></marker></defs><line x1="2" y1="14" x2="24" y2="4" stroke="#1a1a1a" stroke-width="2" marker-end="url(#aprev)"/></svg>
      Pijl${pijlActief?(pijlStart?' (klik eindpunt)':' (klik startpunt)'):''}${pijlActief?' ✓':''}
    </button>
    <button onclick="toggleVerwijderModus()"
      style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius);width:100%;margin-bottom:3px;margin-top:2px;
        border:1.5px solid ${verwijderModus?'#dc2626':'var(--border)'};background:${verwijderModus?'#fee2e2':'var(--white)'};
        cursor:pointer;font-family:inherit;font-size:11px;color:${verwijderModus?'#dc2626':'var(--text)'}">
      <i class="ti ti-trash" style="font-size:14px"></i>
      Verwijderen${verwijderModus?' (actief — klik item)':''}
    </button>
`;

  // Teams
  let teamsHtml = '<div class="sec-lbl" style="margin-top:6px">Teams</div><div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px">';
  Object.entries(TEAM_KLEUREN).forEach(([naam,kleur]) => {
    const heeftTeam = nieuwOefening.teams.some(t=>t.kleur===kleur);
    const label = naam.charAt(0).toUpperCase()+naam.slice(1);
    teamsHtml += `<span onclick="toggleTeamInForm('${kleur}','${label}')"
      style="padding:4px 10px;border-radius:99px;font-size:11px;cursor:pointer;
        border:2px solid ${kleur};background:${heeftTeam?kleur:'var(--white)'};color:${heeftTeam?'white':kleur};font-weight:600">
      ${heeftTeam?'✓ ':''} ${label}
    </span>`;
  });
  teamsHtml += '</div>';

  // Spelers per team
  if(nieuwOefening.teams.length>0){
    nieuwOefening.teams.forEach(team => {
      teamsHtml += `<div style="margin-bottom:6px"><div style="font-size:10px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:50%;background:${team.kleur};display:inline-block"></span>${team.naam}</div><div style="display:flex;flex-wrap:wrap;gap:3px">`;
      (team.spelers||[]).forEach(spId => {
        const sp = spelers.find(s=>s.id===spId);
        if(!sp) return;
        const init = sp.naam.split(' ').map(w=>w[0]).join('').substring(0,3).toUpperCase();
        const opVeld = (nieuwOefening.items||[]).some(i=>i.type==='speler'&&i.spelerId===sp.id);
        const naamEsc = sp.naam.replace(/'/g,'');
        teamsHtml += `<span
          data-speler-id="${sp.id}" data-kleur="${team.kleur}" data-naam="${naamEsc}" data-init="${init}"
          onmousedown="handleSpelerMouseDown(event)"
          style="font-size:10px;padding:2px 8px;border-radius:99px;background:${team.kleur};color:white;cursor:grab;user-select:none;opacity:${opVeld?0.5:1};display:inline-block;margin-bottom:2px"
          title="Sleep naar het veld">
          ${sp.naam.split(' ')[0]}
          <span onclick="event.stopPropagation();verwijderSpelerUitNieuwTeam('${team.kleur}',${sp.id})" style="opacity:0.8;cursor:pointer">×</span>
        </span>`;
      });
      aanwezigen.filter(sp=>!nieuwOefening.teams.some(t2=>t2.spelers&&t2.spelers.includes(sp.id))).forEach(sp => {
        teamsHtml += `<span onclick="voegSpelerToeAanNieuwTeam('${team.kleur}',${sp.id})" style="font-size:10px;padding:2px 7px;border-radius:99px;background:#f3f4f6;color:var(--text-muted);cursor:pointer;border:1px dashed ${team.kleur}">+ ${sp.naam.split(' ')[0]}</span>`;
      });
      teamsHtml += '</div></div>';
    });
  }

  let html = '<div style="background:var(--fcb-groen-licht);border:1px solid var(--fcb-groen);border-radius:var(--radius);padding:14px;margin-bottom:8px">';
  html += '<div style="font-size:13px;font-weight:600;color:var(--fcb-groen);margin-bottom:10px"><i class="ti ti-pencil" style="font-size:15px;margin-right:4px"></i>Nieuwe oefening</div>';

  // Naam + veldgrootte naast elkaar
  html += '<div style="display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:10px;align-items:end">';
  html += '<div><label class="field-label">Naam</label><input type="text" id="oef-naam-input" class="field-input" placeholder="bijv. Rondo 4 tegen 2" value="'+(nieuwOefening.naam||'')+'" oninput="nieuwOefening.naam=this.value"></div>';
  html += '<div><label class="field-label">Veldgrootte</label><div style="display:flex;gap:4px">';
  VELD_OPTIES.forEach(v => {
    const actief = nieuwOefening.veld===v.key;
    html += '<span onclick="nieuwOefening.veld=\''+v.key+'\';saveAndDraw()" style="padding:5px 8px;border-radius:var(--radius);font-size:11px;cursor:pointer;font-weight:500;border:1px solid '+(actief?'var(--fcb-groen)':'var(--border)')+';background:'+(actief?'var(--fcb-groen)':'var(--white)')+';color:'+(actief?'white':'var(--text-muted)')+'">'+v.label+'</span>';
  });
  html += '</div></div></div>';

  // Vel    zijItems
  html += '<div class="veld-editor-grid" style="display:grid;grid-template-columns:1fr 130px;gap:10px;margin-bottom:10px">';
  html += `<div>
    ${actiefItem?`<div style="font-size:10px;color:#1B5E20;background:var(--fcb-groen-licht);padding:4px 8px;border-radius:var(--radius);margin-bottom:4px">
      ${(actiefItem.type==='pijl'||actiefItem.type==='pijl_streep')?(pijlStart?'Klik eindpunt':'Klik startpunt'):'Klik op het veld om te plaatsen — klik item om te verwijderen'}
    </div>`:`<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">Selecteer een item en klik op het veld</div>`}
    <svg data-veld="nieuw" data-oef="nieuw" viewBox="0 0 ${VW} ${VH}" xmlns="http://www.w3.org/2000/svg"
      style="width:100%;border-radius:var(--radius);cursor:${actiefItem?'crosshair':'default'};display:block;border:2px solid ${actiefItem?'var(--fcb-groen)':'transparent'}"
      onclick="handleNieuwVeldKlik(event)"
      onmousemove="handleVeldMuisBeweging(event)"
      onmouseleave="muisVeldPos=null;tekenAfstandLijn()">
      <defs><pattern id="grnieuwoef" x="0" y="0" width="${VW}" height="34" patternUnits="userSpaceOnUse">
        <rect width="${VW}" height="17" fill="#2a5c17"/><rect y="17" width="${VW}" height="17" fill="#2d6319"/>
      </pattern></defs>
      <rect width="${VW}" height="${VH}" fill="url(#grnieuwoef)" rx="4"/>
      <rect x="8" y="8" width="${VW-16}" height="${VH-16}" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="1.5"/>
      ${veldLijnen}
      ${genereerVastePionLijnen(nieuwOefening.items, nieuwOefening.verbindingen)}
      ${geplaatsteItems}
      ${(pijlStart&&actiefItem&&(actiefItem.type==='pijl'||actiefItem.type==='pijl_streep'))?`<circle cx="${pijlStart.x}" cy="${pijlStart.y}" r="4" fill="white" opacity="0.8"/>`:''}
    </svg>
  </div>`;
  html += `<div>${zijItems}</div>`;
  html += '</div>';

  // Teams
  html += teamsHtml;

  // Opmerking
  html += '<div style="margin-bottom:12px">';
  html += '<label class="field-label" style="display:block;margin-bottom:4px">Opmerkingen</label>';
  html += '<textarea id="oef-opmerking-input" class="field-input" rows="4"'
    +' placeholder="Bijv. uitleg van de oefening, aandachtspunten, variaties..."'
    +' style="width:100%;resize:vertical;min-height:80px;font-family:inherit;font-size:13px"'
    +' oninput="nieuwOefening.opmerking=this.value">'
    +(nieuwOefening.opmerking||'')
    +'</textarea>';
  html += '</div>';

  // Knoppen
  html += '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px">';
  html += '<button class="btn-outline" style="font-size:12px;padding:5px 12px" onclick="annuleerNieuweOefening()">Annuleren</button>';
  html += '<button class="btn-green" style="font-size:12px;padding:5px 12px" onclick="slaOefeningOp('+trainingId+')"><i class="ti ti-check" style="font-size:12px"></i> Opslaan</button>';
  html += '</div></div>';
  return html;
}

function saveUndoState(){
  // Sla huidige items op als snapshot
  const snapshot = {
    items: JSON.parse(JSON.stringify(nieuwOefening.items||[])),
    oefId: activeOefeningId,
    trainingId: activeTrainingId,
    // Ook oefeningen items opslaan als een oefening open is
    oefItems: activeOefeningId && activeTrainingId
      ? JSON.parse(JSON.stringify((oefeningen[activeTrainingId]||[]).find(o=>o.id===activeOefeningId)?.items||[]))
      : null
  };
  undoStack.push(snapshot);
  if(undoStack.length > MAX_UNDO) undoStack.shift();
}

function undo(){
  if(undoStack.length === 0) return;
  const snapshot = undoStack.pop();
  // Herstel nieuw oefening items
  nieuwOefening.items = JSON.parse(JSON.stringify(snapshot.items));
  // Herstel oefening items als die open was
  if(snapshot.oefId && snapshot.trainingId && snapshot.oefItems !== null){
    const oef = (oefeningen[snapshot.trainingId]||[]).find(o=>o.id===snapshot.oefId);
    if(oef) oef.items = JSON.parse(JSON.stringify(snapshot.oefItems));
  }
  pijlStart = null;
  draw();
}

function toggleVerwijderModus(){
  verwijderModus = !verwijderModus;
  if(verwijderModus){
    // Deselecteer plaatsingstool tijdens verwijderen
    geselecteerdPlaatsItem = null;
    pijlStart = null;
    laatsteGeplaatstePionId = null;
    muisVeldPos = null;
  }
  draw();
}

function plaatsNieuwItem(type, groot, kleur){
  verwijderModus = false;
  const huidig = geselecteerdPlaatsItem;
  if(huidig && huidig.oefId==='nieuw' && huidig.type===type && huidig.groot===groot && huidig.kleur===kleur){
    geselecteerdPlaatsItem = null; pijlStart = null;
    laatsteGeplaatstePionId = null; // stop afstand meten bij deselecteren
    muisVeldPos = null;
  } else {
    geselecteerdPlaatsItem = {oefId:'nieuw', type, groot, kleur};
    pijlStart = null;
    laatsteGeplaatstePionId = null; // begin opnieuw bij nieuwe pion selectie
    muisVeldPos = null;
  }
  draw();
}

function handleNieuwVeldKlik(event){
  if(dragPijl || controlPointClicked) return;
  if(verwijderModus) return;
  if(!geselecteerdPlaatsItem || geselecteerdPlaatsItem.oefId!=='nieuw') return;
  const svg = event.currentTarget || event.target.closest('svg');
  if(!svg) return;
  const pt = getSVGPoint(event, svg);
  const x = pt.x, y = pt.y;
  if(!isFinite(x) || !isFinite(y)) return;
  if(!nieuwOefening.items) nieuwOefening.items=[];
  if(!nieuwOefening.verbindingen) nieuwOefening.verbindingen=[];
  if(geselecteerdPlaatsItem.type==='pijl'||geselecteerdPlaatsItem.type==='pijl_streep'){
    if(!pijlStart){ pijlStart={x,y}; draw(); }
    else { nieuwOefening.items.push({type:'pijl',kleur:'white',groot:false,x:pijlStart.x,y:pijlStart.y,ex:x,ey:y}); pijlStart=null; draw(); }
  } else if(geselecteerdPlaatsItem.type==='nummer'){
    const volgend = Math.max(0,...nieuwOefening.items.filter(i=>i.type==='nummer').map(i=>i.nummer||0))+1;
    saveUndoState();
    nieuwOefening.items.push({type:'nummer',kleur:'white',groot:false,x,y,nummer:volgend});
    draw();
  } else if(geselecteerdPlaatsItem.type==='pion'){
    // Check of we dicht bij een bestaande pion klikken (binnen 10px)
    const bestaandePion = vindPionDichtbij(nieuwOefening.items, x, y, 1/METER_PER_PX);
    saveUndoState();
    if(bestaandePion && laatsteGeplaatstePionId!==null && bestaandePion.pionId!==laatsteGeplaatstePionId){
      // Verbind laatste pion met deze bestaande pion (bijv. vierkant sluiten)
      nieuwOefening.verbindingen.push({van:laatsteGeplaatstePionId, naar:bestaandePion.pionId});
      laatsteGeplaatstePionId = bestaandePion.pionId;
    } else {
      // Plaats nieuwe pion
      const nieuwId = nextPionId++;
      nieuwOefening.items.push({type:'pion',groot:geselecteerdPlaatsItem.groot,kleur:geselecteerdPlaatsItem.kleur,x,y,pionId:nieuwId});
      // Auto-verbind met vorige pion
      if(laatsteGeplaatstePionId!==null){
        nieuwOefening.verbindingen.push({van:laatsteGeplaatstePionId, naar:nieuwId});
      }
      laatsteGeplaatstePionId = nieuwId;
    }
    draw();
  } else {
    saveUndoState();
    nieuwOefening.items.push({type:geselecteerdPlaatsItem.type,groot:geselecteerdPlaatsItem.groot,kleur:geselecteerdPlaatsItem.kleur,x,y});
    draw();
  }
}

function verwijderNieuwItem(idx){
  if(!verwijderModus) return; // alleen verwijderen in verwijdermodus
  saveUndoState();
  const item = nieuwOefening.items ? nieuwOefening.items[idx] : null;
  // Als het een pion is, verwijder ook de verbindingen ernaar
  if(item && item.type==='pion' && item.pionId!==undefined && nieuwOefening.verbindingen){
    nieuwOefening.verbindingen = nieuwOefening.verbindingen.filter(v=>v.van!==item.pionId && v.naar!==item.pionId);
    if(laatsteGeplaatstePionId===item.pionId) laatsteGeplaatstePionId=null;
  }
  if(nieuwOefening.items) nieuwOefening.items.splice(idx,1);
  draw();
}

let pijlStart = null; // {x, y} eerste klik voor pijl

function handleVeldKlik(event, trainingId, oefId){
  if(dragPijl || controlPointClicked) return;
  if(verwijderModus) return;
  if(!geselecteerdPlaatsItem) return;
  if(geselecteerdPlaatsItem.trainingId!==trainingId||geselecteerdPlaatsItem.oefId!==oefId) return;
  const svg = event.currentTarget || event.target.closest('svg');
  if(!svg) return;
  const pt = getSVGPoint(event, svg);
  const x = pt.x, y = pt.y;
  if(!isFinite(x) || !isFinite(y)) return;
  const oef = (oefeningen[trainingId]||[]).find(o=>o.id===oefId);
  if(!oef) return;
  if(!oef.items) oef.items=[];
  if(!oef.verbindingen) oef.verbindingen=[];
  if(geselecteerdPlaatsItem.type==='pijl'||geselecteerdPlaatsItem.type==='pijl_streep'){
    if(!pijlStart){ pijlStart={x,y}; draw(); }
    else { saveUndoState(); oef.items.push({type:'pijl',kleur:'white',groot:false,x:pijlStart.x,y:pijlStart.y,ex:x,ey:y}); pijlStart=null; draw(); }
  } else if(geselecteerdPlaatsItem.type==='nummer'){
    const volgend = Math.max(0,...oef.items.filter(i=>i.type==='nummer').map(i=>i.nummer||0))+1;
    saveUndoState();
    oef.items.push({type:'nummer',kleur:'white',groot:false,x,y,nummer:volgend});
    draw();
  } else if(geselecteerdPlaatsItem.type==='pion'){
    const bestaandePion = vindPionDichtbij(oef.items, x, y, 1/METER_PER_PX);
    saveUndoState();
    if(bestaandePion && laatsteGeplaatstePionId!==null && bestaandePion.pionId!==laatsteGeplaatstePionId){
      oef.verbindingen.push({van:laatsteGeplaatstePionId, naar:bestaandePion.pionId});
      laatsteGeplaatstePionId = bestaandePion.pionId;
    } else {
      const nieuwId = nextPionId++;
      oef.items.push({type:'pion',groot:geselecteerdPlaatsItem.groot,kleur:geselecteerdPlaatsItem.kleur,x,y,pionId:nieuwId});
      if(laatsteGeplaatstePionId!==null){
        oef.verbindingen.push({van:laatsteGeplaatstePionId, naar:nieuwId});
      }
      laatsteGeplaatstePionId = nieuwId;
    }
    draw();
  } else {
    saveUndoState();
    oef.items.push({type:geselecteerdPlaatsItem.type,groot:geselecteerdPlaatsItem.groot,kleur:geselecteerdPlaatsItem.kleur,x,y});
    draw();
  }
}

let dragPijl = null; // {trainingId|'nieuw', oefId, idx, svgEl}
let undoStack = []; // array of snapshots
const MAX_UNDO = 20;

function getSVGPoint(event, svgEl){
  const rect = svgEl.getBoundingClientRect();
  const vb = svgEl.viewBox.baseVal;
  const touch = event.touches && event.touches.length > 0 ? event.touches[0] : null;
  const clientX = touch ? touch.clientX : event.clientX;
  const clientY = touch ? touch.clientY : event.clientY;
  if(!clientX && clientX !== 0) return {x:0, y:0};
  return {
    x: Math.round((clientX-rect.left)/rect.width*vb.width),
    y: Math.round((clientY-rect.top)/rect.height*vb.height)
  };
}

let controlPointClicked = false;

function startDragPijl(event, trainingId, oefId, idx){
  event.stopPropagation();
  controlPointClicked = true;
  const svgEl = event.currentTarget.closest('svg');
  dragPijl = {trainingId, oefId, idx, svgEl, moved:false};
  draw();
}

function startDragPijlNieuw(event, idx){
  event.stopPropagation();
  controlPointClicked = true;
  const svgEl = event.currentTarget.closest('svg');
  dragPijl = {trainingId:null, oefId:'nieuw', idx, svgEl, moved:false};
  draw();
}

function startDragPijlTouch(event, trainingId, oefId, idx){
  event.preventDefault();
  startDragPijl(event, trainingId, oefId, idx);
}

function startDragPijlNieuwTouch(event, idx){
  event.preventDefault();
  startDragPijlNieuw(event, idx);
}

document.addEventListener('mousemove', function(event){
  if(!dragPijl) return;
  dragPijl.moved = true;
  // Zoek SVG opnieuw op in DOM (voorkomt stale referentie na draw())
  const liveSvg = dragPijl.oefId==='nieuw'
    ? document.querySelector('svg[onclick*="handleNieuwVeldKlik"]')
    : document.querySelector('svg[onclick*="handleVeldKlik"]');
  if(!liveSvg) return;
  const pt = getSVGPoint(event, liveSvg);
  if(!isFinite(pt.x) || !isFinite(pt.y)) return;
  if(dragPijl.oefId==='nieuw'){
    if(nieuwOefening.items && nieuwOefening.items[dragPijl.idx]){
      nieuwOefening.items[dragPijl.idx].cx = pt.x;
      nieuwOefening.items[dragPijl.idx].cy = pt.y;
      draw();
    }
  } else {
    const oef = (oefeningen[dragPijl.trainingId]||[]).find(o=>o.id===dragPijl.oefId);
    if(oef && oef.items && oef.items[dragPijl.idx]){
      oef.items[dragPijl.idx].cx = pt.x;
      oef.items[dragPijl.idx].cy = pt.y;
      draw();
    }
  }
});

document.addEventListener('mouseup', function(){
  if(dragPijl){
    if(dragPijl.moved) saveUndoState();
    dragPijl = null;
    setTimeout(()=>{ controlPointClicked = false; }, 0);
  }
});

document.addEventListener('touchmove', function(event){
  if(!dragPijl) return;
  event.preventDefault();
  const liveSvg = dragPijl.oefId==='nieuw'
    ? document.querySelector('svg[onclick*="handleNieuwVeldKlik"]')
    : document.querySelector('svg[onclick*="handleVeldKlik"]');
  if(!liveSvg) return;
  const pt = getSVGPoint(event, liveSvg);
  if(!isFinite(pt.x) || !isFinite(pt.y)) return;
  if(dragPijl.oefId==='nieuw'){
    if(nieuwOefening.items && nieuwOefening.items[dragPijl.idx]){
      nieuwOefening.items[dragPijl.idx].cx = pt.x;
      nieuwOefening.items[dragPijl.idx].cy = pt.y;
      draw();
    }
  } else {
    const oef = (oefeningen[dragPijl.trainingId]||[]).find(o=>o.id===dragPijl.oefId);
    if(oef && oef.items && oef.items[dragPijl.idx]){
      oef.items[dragPijl.idx].cx = pt.x;
      oef.items[dragPijl.idx].cy = pt.y;
      draw();
    }
  }
}, {passive: false});

document.addEventListener('touchend', function(){
  if(dragPijl){ 
    dragPijl = null;
    setTimeout(()=>{ controlPointClicked = false; }, 0);
  }
});

// ---- SPELER DRAG ----
function handleSpelerOpVeldMouseDown(event, trainingId, oefId, veldType, itemIdx){
  event.stopPropagation();
  // Bepaal speler info van data attributes
  const el = event.currentTarget;
  const spelerId = parseInt(el.getAttribute('data-speler-id'));
  const teamKleur = el.getAttribute('data-kleur');
  const naam = el.getAttribute('data-naam');
  const init = el.getAttribute('data-init');
  // Verwijder van veld
  if(veldType==='nieuw'){
    if(nieuwOefening.items) nieuwOefening.items.splice(itemIdx,1);
  } else {
    const oef = (oefeningen[trainingId]||[]).find(o=>o.id===oefId);
    if(oef&&oef.items) oef.items.splice(itemIdx,1);
  }
  // Start drag
  startDragSpeler(event, spelerId, teamKleur, naam, init);
  draw();
}

function handleSpelerMouseDown(event){
  const el = event.currentTarget;
  const spelerId = parseInt(el.getAttribute('data-speler-id'));
  const teamKleur = el.getAttribute('data-kleur');
  const naam = el.getAttribute('data-naam');
  const init = el.getAttribute('data-init');
  startDragSpeler(event, spelerId, teamKleur, naam, init);
}

function startDragSpeler(event, spelerId, teamKleur, naam, init){
  event.stopPropagation();
  dragSpeler = {spelerId, teamKleur, naam, init};
  let ghost = document.getElementById('speler-ghost');
  if(!ghost){
    ghost = document.createElement('div');
    ghost.id = 'speler-ghost';
    ghost.style.cssText = 'position:fixed;pointer-events:none;z-index:9999;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;color:white;display:none;transform:translate(-50%,-50%);white-space:nowrap';
    document.body.appendChild(ghost);
  }
  ghost.style.background = teamKleur;
  ghost.textContent = naam.split(' ')[0];
  ghost.style.display = 'block';
  const cx = event.touches ? event.touches[0].clientX : event.clientX;
  const cy = event.touches ? event.touches[0].clientY : event.clientY;
  ghost.style.left = cx+'px';
  ghost.style.top = cy+'px';
}

function plaatsSpelerOpSVG(clientX, clientY, svgEl){
  if(!dragSpeler||!svgEl) return;
  const pt = getSVGPoint({clientX, clientY, touches:null}, svgEl);
  if(!isFinite(pt.x)||!isFinite(pt.y)){dragSpeler=null;return;}
  const isNieuw = svgEl.getAttribute('data-oef')==='nieuw';
  const trainingId = parseInt(svgEl.getAttribute('data-training'));
  const oefId = parseInt(svgEl.getAttribute('data-oef'));
  const spelerItem = {type:'speler', spelerId:dragSpeler.spelerId, teamKleur:dragSpeler.teamKleur, naam:dragSpeler.naam, init:dragSpeler.init, x:pt.x, y:pt.y};
  if(isNieuw){
    if(!nieuwOefening.items) nieuwOefening.items=[];
    nieuwOefening.items = nieuwOefening.items.filter(i=>!(i.type==='speler'&&i.spelerId===dragSpeler.spelerId));
    nieuwOefening.items.push(spelerItem);
  } else {
    const oef = (oefeningen[trainingId]||[]).find(o=>o.id===oefId);
    if(!oef) return;
    if(!oef.items) oef.items=[];
    oef.items = oef.items.filter(i=>!(i.type==='speler'&&i.spelerId===dragSpeler.spelerId));
    oef.items.push(spelerItem);
  }
  dragSpeler = null;
  const ghost = document.getElementById('speler-ghost');
  if(ghost) ghost.style.display='none';
  draw();
}

document.addEventListener('mousemove', function(e){
  if(!dragSpeler) return;
  const ghost = document.getElementById('speler-ghost');
  if(ghost){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';}
});

document.addEventListener('mouseup', function(e){
  if(!dragSpeler) return;
  // Probeer via target, dan via elementFromPoint
  let svgEl = e.target && e.target.closest ? e.target.closest('svg[data-veld]') : null;
  if(!svgEl){
    const elOnder = document.elementFromPoint(e.clientX, e.clientY);
    svgEl = elOnder && elOnder.closest ? elOnder.closest('svg[data-veld]') : null;
  }
  if(svgEl){
    plaatsSpelerOpSVG(e.clientX, e.clientY, svgEl);
  } else {
    dragSpeler = null;
    const ghost = document.getElementById('speler-ghost');
    if(ghost) ghost.style.display='none';
  }
});

document.addEventListener('touchmove', function(e){
  if(!dragSpeler) return;
  const ghost = document.getElementById('speler-ghost');
  if(ghost&&e.touches[0]){ghost.style.left=e.touches[0].clientX+'px';ghost.style.top=e.touches[0].clientY+'px';}
},{passive:true});

document.addEventListener('touchend', function(e){
  if(!dragSpeler) return;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const svgEl = el&&el.closest ? el.closest('svg[data-veld]') : null;
  if(svgEl){
    plaatsSpelerOpSVG(t.clientX, t.clientY, svgEl);
  } else {
    dragSpeler = null;
    const ghost = document.getElementById('speler-ghost');
    if(ghost) ghost.style.display='none';
  }
});

function verwijderItemVeld(trainingId, oefId, itemIdx){
  const oef = (oefeningen[trainingId]||[]).find(o=>o.id===oefId);
  if(oef&&oef.items) oef.items.splice(itemIdx,1);
  draw();
}

// ---- START ----
draw();
</script>
